apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: user-service
    migration-step: extracted
spec:
  # user-service is now active (PR 12 of the extraction roadmap). Kong
  # routes /api/users/{id} (incl. /me) here. The /me/image and /me/banner
  # uploads stay on legacy-monolith for now (FileStorageService + S3 deps
  # live there ; migrated in a follow-up after PR 13).
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: user-service
          image: {{ .Values.image.registry }}/{{ .Values.image.org }}/unige-events-user-service:{{ .Values.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            # Étape 4.5 finalization-complete (TZ-DRIFT / Décision F)
            - name: TZ
              value: "Europe/Zurich"
            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.timezone=Europe/Zurich"
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "5432"
            - name: KAFKA_BOOTSTRAP
              value: kafka:9092
            - name: S3_ENDPOINT
              value: http://minio:9000
          envFrom:
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
              ephemeral-storage: "128Mi"
            limits:
              memory: "256Mi"
              ephemeral-storage: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/q/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
