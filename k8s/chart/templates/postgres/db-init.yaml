apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-db-init
  namespace: {{ .Release.Namespace }}
  annotations:
    # Run after every helm upgrade — CREATE DATABASE is idempotent (|| true guards against "already exists").
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: postgres-db-init
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      containers:
        - name: postgres-db-init
          image: {{ .Values.db.image }}
          env:
            - name: PGHOST
              value: postgres
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
          command:
            - /bin/sh
            - -c
            - |
              set -e
              echo "Waiting for postgres..."
              until pg_isready -h postgres -U "$PGUSER"; do sleep 2; done
              echo "Creating service databases..."
              psql -c "CREATE DATABASE unige_events_events;"      || true
              psql -c "CREATE DATABASE unige_events_users;"       || true
              psql -c "CREATE DATABASE unige_events_engagement;"  || true
              psql -c "CREATE DATABASE unige_events_moderation;"  || true
              psql -c "CREATE DATABASE unige_events_notifications;" || true
              echo "Done."
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
              ephemeral-storage: "64Mi"
            limits:
              memory: "128Mi"
              ephemeral-storage: "128Mi"
