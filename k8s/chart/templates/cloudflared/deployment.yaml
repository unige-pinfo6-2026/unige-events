{{- if .Values.cloudflared.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cloudflared
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      automountServiceAccountToken: false
      {{- if eq .Values.cloudflared.mode "named" }}
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      {{- end }}
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:latest
          {{- if eq .Values.cloudflared.mode "named" }}
          args:
            - tunnel
            - --no-autoupdate
            - --loglevel
            - info
            - --metrics
            - 127.0.0.1:2000
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: CLOUDFLARE_TUNNEL_TOKEN
          {{- else }}
          args:
            - tunnel
            - --no-autoupdate
            - --loglevel
            - info
            - --metrics
            - 0.0.0.0:2000
            - --url
            - http://$(NODE_IP)
            - --http-host-header
            - {{ .Values.ingress.host }}
          env:
            - name: NODE_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          {{- end }}
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
              ephemeral-storage: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /ready
              port: 2000
              {{- if eq .Values.cloudflared.mode "named" }}
              host: 127.0.0.1
              {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 2000
              {{- if eq .Values.cloudflared.mode "named" }}
              host: 127.0.0.1
              {{- end }}
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
{{- end }}
