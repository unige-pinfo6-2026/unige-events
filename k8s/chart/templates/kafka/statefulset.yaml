apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
      annotations:
        # Force a pod-template-hash bump on every helm upgrade. Without
        # this, a kafka-0 pod stuck in CrashLoopBackOff (e.g. PR #158
        # retries 1-4 with the wrong KAFKA_CONTROLLER_QUORUM_VOTERS) is
        # never replaced by the StatefulSet controller — RollingUpdate
        # waits indefinitely for the old pod to become Ready, even though
        # the spec has been patched to a working config. Tying the
        # annotation to .Values.image.api.tag (= github.sha) guarantees
        # a fresh hash on every PR commit, which forces deletion of the
        # old pod and creation of a new one with the latest spec.
        unige-events.io/release-sha: {{ .Values.image.api.tag | quote }}
    spec:
      automountServiceAccountToken: false
      # apache/kafka:3.7.0 runs as the non-root user `appuser` (UID 1000).
      # Without fsGroup, the PVC is mounted root:root and the broker
      # crashes with "Permission denied" on /var/lib/kafka/data — exactly
      # the failure mode of PR #158 retry 2 (StatefulSet status: Failed,
      # 1 pods have failed). Setting fsGroup=1000 makes the volume
      # group-writable for the kafka user.
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsNonRoot: true
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            # ─── KRaft single-node mode (no Zookeeper) ──────────────────────
            # In S8 we deploy a single Kafka broker that is also its own
            # controller (combined process role). Cluster ID is hard-coded;
            # rotating it requires a fresh PVC. Replication factor is 1 —
            # acceptable for a course/demo, not production.
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              # Single-node KRaft with combined process roles (broker AND
              # controller in the same JVM): the voter MUST be reachable
              # before the headless service has a stable DNS record for the
              # pod. Using `kafka-0.kafka` failed in PR #158 retry 3 with
              # "fatal error while waiting for the controller to acknowledge"
              # because the broker self-references a name that won't resolve
              # until the StatefulSet pod is registered with the headless
              # service (chicken-and-egg at first boot). localhost trivially
              # resolves and is correct for a combined single-node setup.
              value: "1@localhost:9093"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_NUM_PARTITIONS
              value: "1"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "1"
            # CLUSTER_ID must be a stable 22-char base64 UUID. Generated once
            # via `kafka-storage.sh random-uuid`. Rotating it implies dropping
            # the PVC. Persisted in the ConfigMap below to allow re-creation
            # of the StatefulSet on the same volume.
            - name: CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: kafka-cluster-id
                  key: clusterId
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          readinessProbe:
            # First-time KRaft format on a fresh PVC + JVM startup typically
            # takes 30-60s; binding 9092 only happens after that. Pre-PR #158
            # deploy fail: probe started at 15s and went 6×10s = 75s ceiling,
            # which was hit before Kafka was ready in some preview namespaces.
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 18
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 120
            periodSeconds: 30
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.kafka.storageSize }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-cluster-id
  namespace: {{ .Release.Namespace }}
data:
  # Stable 22-char base64 UUID. Treat as immutable: rotating this id requires
  # also dropping the data PVC (kraft-mode cluster id is encoded in the log
  # directory metadata). Generated via:
  #   kafka-storage.sh random-uuid
  clusterId: "MkU3OEVBNTcwNTJENDM2Qk"
