apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  namespace: {{ .Release.Namespace }}
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      automountServiceAccountToken: false
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: client
              containerPort: 9092
            - name: controller
              containerPort: 9093
          env:
            # ─── KRaft single-node mode (no Zookeeper) ──────────────────────
            # In S8 we deploy a single Kafka broker that is also its own
            # controller (combined process role). Cluster ID is hard-coded;
            # rotating it requires a fresh PVC. Replication factor is 1 —
            # acceptable for a course/demo, not production.
            - name: KAFKA_NODE_ID
              value: "1"
            - name: KAFKA_PROCESS_ROLES
              value: "broker,controller"
            - name: KAFKA_LISTENERS
              value: "PLAINTEXT://:9092,CONTROLLER://:9093"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "PLAINTEXT://kafka:9092"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: "PLAINTEXT"
            - name: KAFKA_CONTROLLER_LISTENER_NAMES
              value: "CONTROLLER"
            - name: KAFKA_CONTROLLER_QUORUM_VOTERS
              value: "1@kafka-0.kafka:9093"
            - name: KAFKA_LOG_DIRS
              value: "/var/lib/kafka/data"
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
              value: "1"
            - name: KAFKA_AUTO_CREATE_TOPICS_ENABLE
              value: "false"
            - name: KAFKA_NUM_PARTITIONS
              value: "1"
            - name: KAFKA_DEFAULT_REPLICATION_FACTOR
              value: "1"
            - name: KAFKA_MIN_INSYNC_REPLICAS
              value: "1"
            # CLUSTER_ID must be a stable 22-char base64 UUID. Generated once
            # via `kafka-storage.sh random-uuid`. Rotating it implies dropping
            # the PVC. Persisted in the ConfigMap below to allow re-creation
            # of the StatefulSet on the same volume.
            - name: CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: kafka-cluster-id
                  key: clusterId
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.kafka.storageSize }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-cluster-id
  namespace: {{ .Release.Namespace }}
data:
  # Stable 22-char base64 UUID. Treat as immutable: rotating this id requires
  # also dropping the data PVC (kraft-mode cluster id is encoded in the log
  # directory metadata). Generated via:
  #   kafka-storage.sh random-uuid
  clusterId: "MkU3OEVBNTcwNTJENDM2Qk"
