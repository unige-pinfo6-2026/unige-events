apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: event-service
    migration-step: extracted
spec:
  # event-service is now active (PR 13 of the extraction roadmap). Kong
  # routes /api/events* + /api/admin/events/{id}/{,un}feature here.
  # Hosts EventExpirationJob (every 1h) — replicas: 1 strict (no leader
  # election in S8). The /events/{id}/image upload stays on legacy-monolith
  # via the catch-all (FileStorageService not ported in S8 ; follow-up PR
  # migrates it).
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: event-service
          image: {{ .Values.image.registry }}/{{ .Values.image.org }}/unige-events-event-service:{{ .Values.image.api.tag | default "latest" }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "5432"
            - name: KAFKA_BOOTSTRAP
              value: kafka:9092
            - name: S3_ENDPOINT
              value: http://minio:9000
          envFrom:
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
              ephemeral-storage: "128Mi"
            limits:
              memory: "256Mi"
              ephemeral-storage: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/q/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
