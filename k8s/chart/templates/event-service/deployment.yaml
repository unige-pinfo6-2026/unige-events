apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: event-service
    migration-step: extracted
spec:
  # event-service is now active (depuis Étape 2.2 event-service
  # finalization, cf. backend/docs/sprint-context.md § Étape 23). Kong
  # routes /api/events* + /api/admin/events/{id}/{,un}feature here.
  # Hosts EventExpirationJob (every 1h) — replicas: 1 strict (no leader
  # election in S8).
  #
  # ─── Helm guard: replicas:1 strict (Étape 24.5.2, A3) ────────────────────
  # event-service hosts EventExpirationJob (@Scheduled every 1h). Without
  # leader-election, scaling out would double-fire events.expired Kafka
  # events and double-update Event.status concurrently. Forbidden until
  # Shedlock is wired (S9+). Cf. ADR-001 (originally moderation-cleanup,
  # extended to event-service in Étape 24.5.2 — see ADR-001 § "How this
  # is enforced" point 6).
  {{- if gt (int .Values.eventService.replicas | default 1) 1 }}
  {{- fail "event-service must run at replicas:1 strict — EventExpirationJob has no leader election. Cf. ADR-001." }}
  {{- end }}
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: event-service
          image: {{ .Values.image.registry }}/{{ .Values.image.org }}/unige-events-event-service:{{ .Values.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            # Étape 4.5 finalization-complete (TZ-DRIFT / Décision F)
            - name: TZ
              value: "Europe/Zurich"
            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.timezone=Europe/Zurich"
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "5432"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: S3_ENDPOINT
              value: http://minio:9000
          envFrom:
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
              ephemeral-storage: "128Mi"
            limits:
              memory: "256Mi"
              ephemeral-storage: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/q/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
