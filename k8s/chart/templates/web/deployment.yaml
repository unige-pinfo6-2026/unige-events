apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: {{ .Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: web
          image: {{ .Values.image.registry }}/{{ .Values.image.org }}/{{ .Values.image.web.name }}:{{ .Values.image.web.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 80
          # Étape 4.5 finalization-complete (TZ-DRIFT / Décision F)
          env:
            - name: TZ
              value: "Europe/Zurich"
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          # Étape 4.12 finalization-complete (WEB-DEPLOY-PROBES): symmetric
          # parity with the 5 backend services that already declare both
          # readinessProbe and livenessProbe — silent nginx crashes (OOM,
          # config typo) now lead to a pod restart instead of a black-hole.
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
