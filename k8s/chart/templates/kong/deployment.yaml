apiVersion: apps/v1
kind: Deployment
metadata:
  name: kong
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.kong.replicas }}
  selector:
    matchLabels:
      app: kong
  template:
    metadata:
      labels:
        app: kong
      annotations:
        # DB-less Kong reloads declarative config on pod restart.
        checksum/routes: {{ include (print $.Template.BasePath "/kong/configmap-routes.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      containers:
        - name: kong
          image: {{ .Values.kong.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy
              containerPort: 8000
            - name: admin
              containerPort: 8001
            - name: status
              containerPort: 8100
          env:
            - name: KONG_DATABASE
              value: "off"
            - name: KONG_DECLARATIVE_CONFIG
              value: /etc/kong/kong.yml
            - name: KONG_PROXY_LISTEN
              value: "0.0.0.0:8000"
            - name: KONG_ADMIN_LISTEN
              value: "127.0.0.1:8001"
            - name: KONG_STATUS_LISTEN
              value: "0.0.0.0:8100"
            - name: KONG_LOG_LEVEL
              value: notice
            - name: KONG_PLUGINS
              value: bundled
            - name: KONG_PROXY_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_ADMIN_ACCESS_LOG
              value: /dev/stdout
            - name: KONG_PROXY_ERROR_LOG
              value: /dev/stderr
            - name: KONG_ADMIN_ERROR_LOG
              value: /dev/stderr
          volumeMounts:
            - name: kong-config
              mountPath: /etc/kong
              readOnly: true
          resources:
            {{- toYaml .Values.kong.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /status/ready
              port: status
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /status
              port: status
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
      volumes:
        - name: kong-config
          configMap:
            name: kong-config
