apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: {{ .Release.Namespace }}
data:
  kong.yml: |
    _format_version: "3.0"

    # ─────────────────────────────────────────────────────────────────────────
    # Routing table — post-migration (PR 14, legacy-monolith removed)
    # ─────────────────────────────────────────────────────────────────────────
    # The strangler-fig is complete : there is no `monolith-api` upstream
    # and no `api-catchall` route. Every /api/* path is matched by an
    # explicit per-service regex below ; an unmatched path now returns a
    # Kong 404 (correct behaviour — there's no legacy fallback to swallow
    # bad URLs). The 13 service blocks below are listed in the historical
    # extraction order (PR 1 ... PR 13), not in routing-priority order
    # (Kong picks the longest matching regex regardless of declaration
    # order).
    services:
      # ───── PR 1 — share-service (extracted) ─────────────────────────────
      # Routes /api/events/{id}/share + /api/s/{shortCode} to share-service.
      # Kong route matching: regex paths outrank prefix paths, so even
      # though /api still matches via api-catchall, Kong picks these
      # specific regexes first.
      - name: share-service
        url: http://share-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: event-share
            paths:
              - ~/api/events/(?:\d+)/share$
            strip_path: false
            preserve_host: true
          - name: shortlink
            paths:
              - ~/api/s/[^/]+$
            strip_path: false
            preserve_host: true

      # ───── PR 2 — view-service (extracted) ──────────────────────────────
      - name: view-service
        url: http://view-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: event-view
            paths:
              - ~/api/events/(?:\d+)/view$
            strip_path: false
            preserve_host: true

      # ───── PR 3 — favorite-service (extracted) ──────────────────────────
      # Routes POST/DELETE /api/events/{id}/favorite + GET /api/users/me/favorites
      # to favorite-service. The legacy monolith still serves the rest of
      # /api/users/me/* (attendances, participations) until those services
      # are extracted.
      - name: favorite-service
        url: http://favorite-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: favorite-actions
            paths:
              - ~/api/events/(?:\d+)/favorite$
            strip_path: false
            preserve_host: true
          - name: my-favorites
            paths:
              - ~/api/users/me/favorites$
            strip_path: false
            preserve_host: true

      # ───── PR 4 — calendar-service (extracted) ──────────────────────────
      # Routes the user's calendar-token endpoints + the public ICS feed
      # to calendar-service. read_timeout bumped to 60s : the ICS endpoint
      # bulk-fetches every published event the user is signed up for or
      # has favorited.
      - name: calendar-service
        url: http://calendar-service:8080
        connect_timeout: 5000
        read_timeout: 60000
        write_timeout: 30000
        routes:
          - name: calendar-token
            paths:
              - ~/api/users/me/calendar-token$
            strip_path: false
            preserve_host: true
          - name: calendar-regen
            paths:
              - ~/api/users/me/calendar-token/regenerate$
            strip_path: false
            preserve_host: true
          - name: ics-feed
            paths:
              - ~/api/calendar/[^/]+\.ics$
            strip_path: false
            preserve_host: true

      # ───── PR 13 — event-service (extracted) ────────────────────────────
      # All /events/* and /admin/events/{id}/{,un}feature paths.
      # /events/search needs to win over /events/{digit-id} so it's
      # listed first ; same for /featured. The /events/{id}/image upload
      # is INTENTIONALLY not routed here — it stays on legacy-monolith
      # via the catch-all because FileStorageService + S3 wiring isn't
      # ported in S8 (cf. PR 12 user-service for the same trade-off).
      # Hosts EventExpirationJob scheduler (every 1h).
      - name: event-service
        url: http://event-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: events-search
            paths:
              - ~/api/events/search$
            strip_path: false
            preserve_host: true
          - name: events-featured
            paths:
              - ~/api/events/featured$
            strip_path: false
            preserve_host: true
          - name: admin-event-feature
            paths:
              - ~/api/admin/events/(?:\d+)/(?:un)?feature$
            strip_path: false
            preserve_host: true
          - name: events-occurrences
            paths:
              - ~/api/events/(?:\d+)/occurrences$
            strip_path: false
            preserve_host: true
          - name: events-cancel
            paths:
              - ~/api/events/(?:\d+)/cancel$
            strip_path: false
            preserve_host: true
          - name: events-restore
            paths:
              - ~/api/events/(?:\d+)/restore$
            strip_path: false
            preserve_host: true
          - name: events-publish
            paths:
              - ~/api/events/(?:\d+)/publish$
            strip_path: false
            preserve_host: true
          - name: events-image
            paths:
              - ~/api/events/(?:\d+)/image$
            strip_path: false
            preserve_host: true
          - name: events-by-id
            paths:
              - ~/api/events/(?:\d+)$
            strip_path: false
            preserve_host: true
          - name: events-list
            paths:
              - ~/api/events$
            strip_path: false
            preserve_host: true
            plugins:
              # spec décision 6 / completion-spec Étape 10 — bucket
              # `events.create=10/min`. policy=local : compteur par
              # instance Kong (acceptable en S8, single-cluster). Le
              # `@PerUserRateLimit` Java côté event-service couvre
              # l'UX (max=10, windowSeconds=60) — Kong protège l'edge.
              - name: rate-limiting
                config:
                  minute: 10
                  policy: local
                  fault_tolerant: true
                  hide_client_headers: false

      # ───── PR 12 — user-service (extracted) ─────────────────────────────
      # GET/PUT /api/users/me + GET /api/users/{uuid} + POST/DELETE
      # /api/users/me/image + POST/DELETE /api/users/me/banner. The /me/image
      # and /me/banner regexes are listed BEFORE the /[^/]+$ catch so Kong
      # matches them first (regex specificity : an explicit literal beats
      # a single-segment wildcard). The other /me/* paths (calendar-token,
      # follow-requests, co-organizer-invitations, events, attendances,
      # participations, favorites) keep their per-service routes via even
      # more specific regexes.
      #
      # NB: the regex /api/users/[^/]+$ ALSO matches /api/users/me, but
      # that's intentional — both targets land on user-service which
      # handles /me (Authenticated) and /{uuid} (PermitAll) on the same
      # @Path("/users") class.
      - name: user-service
        url: http://user-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: user-image
            paths:
              - ~/api/users/me/image$
            strip_path: false
            preserve_host: true
          - name: user-banner
            paths:
              - ~/api/users/me/banner$
            strip_path: false
            preserve_host: true
          - name: user-by-id
            paths:
              - ~/api/users/[^/]+$
            strip_path: false
            preserve_host: true

      # ───── PR 11 — me-aggregator-service (extracted) ────────────────────
      # BFF — owns /users/me/events for now. The other /me/* paths
      # (favorites, attendances, participations) stay on favorite-service
      # / attendance-service until event-service ships and the BFF grows
      # REST clients to fan-out (per the spec § "Activate this LAST" note).
      - name: me-aggregator-service
        url: http://me-aggregator-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: my-events-bff
            paths:
              - ~/api/users/me/events$
            strip_path: false
            preserve_host: true

      # ───── PR 10 — stats-service (extracted) ────────────────────────────
      # Routes /api/events/{id}/stats — per-event analytics counter.
      - name: stats-service
        url: http://stats-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: event-stats
            paths:
              - ~/api/events/(?:\d+)/stats$
            strip_path: false
            preserve_host: true

      # ───── PR 9 — moderation-service (renamed from report-service) ─────
      # Routes the report endpoint + the admin moderation queue. Hosts the
      # ModerationCleanupJob scheduler (cron 03:00 Europe/Zurich,
      # replicas:1 strict) and the events.banned Kafka producer.
      - name: moderation-service
        url: http://moderation-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: report-event
            paths:
              - ~/api/events/(?:\d+)/report$
            strip_path: false
            preserve_host: true
          - name: admin-reports
            paths:
              - ~/api/admin/reports$
            strip_path: false
            preserve_host: true
          - name: admin-report-id
            paths:
              - ~/api/admin/reports/(?:\d+)$
            strip_path: false
            preserve_host: true

      # ───── PR 8 — engagement-service (renamed from attendance-service) ──
      # Routes the attend / attendees endpoints + /me/attendances and
      # /me/participations to engagement-service. After step 2.4.1 this
      # block also serves /api/events/{id}/comments and /api/comments/{id}.
      - name: engagement-service
        url: http://engagement-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: attend-actions
            paths:
              - ~/api/events/(?:\d+)/attend$
            strip_path: false
            preserve_host: true
          - name: event-attendees
            paths:
              - ~/api/events/(?:\d+)/attendees$
            strip_path: false
            preserve_host: true
          - name: my-attendances
            paths:
              - ~/api/users/me/attendances$
            strip_path: false
            preserve_host: true
          - name: my-participations
            paths:
              - ~/api/users/me/participations$
            strip_path: false
            preserve_host: true

      # ───── PR 7 — co-organizer-service (extracted) ──────────────────────
      # The co-organizer routes share the /api/events/{id}/co-organizers
      # prefix : invite/list at the bare path, accept/decline under /me/,
      # and DELETE under /{userId}. Listed in regex-specificity order.
      - name: co-organizer-service
        url: http://co-organizer-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: co-organizer-me
            paths:
              - ~/api/events/(?:\d+)/co-organizers/me/(?:accept|decline)$
            strip_path: false
            preserve_host: true
          - name: co-organizer-userid
            paths:
              - ~/api/events/(?:\d+)/co-organizers/[^/]+$
            strip_path: false
            preserve_host: true
          - name: co-organizers
            paths:
              - ~/api/events/(?:\d+)/co-organizers$
            strip_path: false
            preserve_host: true
          - name: my-co-org-invites
            paths:
              - ~/api/users/me/co-organizer-invitations$
            strip_path: false
            preserve_host: true

      # ───── PR 6 — comment-service (extracted) ───────────────────────────
      # Routes /api/events/{id}/comments (POST + GET) + /api/comments/{id}
      # (DELETE) to comment-service.
      - name: comment-service
        url: http://comment-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: event-comments
            paths:
              - ~/api/events/(?:\d+)/comments$
            strip_path: false
            preserve_host: true
            plugins:
              # bucket `comments.post=10/min` (completion-spec Étape 10).
              - name: rate-limiting
                config:
                  minute: 10
                  policy: local
                  fault_tolerant: true
                  hide_client_headers: false
          - name: comment-direct
            paths:
              - ~/api/comments/(?:\d+)$
            strip_path: false
            preserve_host: true

      # ───── PR 5 — follow-service (extracted) ────────────────────────────
      # Follow / follow-request endpoints. Note: /api/users/me/follow-requests
      # is namespace-anchored at /me/, while /api/users/{uuid}/follow{,ers,ing}
      # uses a UUID segment — kept distinct via separate regex routes so
      # the catchall keeps serving the rest of /api/users/* (auth profile,
      # banner, image…) until user-service is extracted.
      - name: follow-service
        url: http://follow-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: follow-actions
            paths:
              - ~/api/users/[^/]+/follow$
            strip_path: false
            preserve_host: true
            plugins:
              # bucket `follows.follow=30/min` (completion-spec Étape 10).
              - name: rate-limiting
                config:
                  minute: 30
                  policy: local
                  fault_tolerant: true
                  hide_client_headers: false
          - name: follow-listings
            paths:
              - ~/api/users/[^/]+/(?:followers|following)$
            strip_path: false
            preserve_host: true
          - name: follow-requests
            paths:
              - ~/api/follow-requests/(?:\d+)/(?:accept|reject)$
            strip_path: false
            preserve_host: true
          - name: my-follow-reqs
            paths:
              - ~/api/users/me/follow-requests$
            strip_path: false
            preserve_host: true

      # ───────────────────────────────────────────────────────────────────────
      # Target topology — commented out, ready to flip per extraction PR
      # ───────────────────────────────────────────────────────────────────────
      # The blocks below describe where each path SHOULD route once the
      # corresponding microservice has been extracted from legacy-monolith
      # (cf. specs_microservices_migration.md § "Routage Kong"). To activate
      # one of them: uncomment the block, narrow the `paths` of api-catchall
      # above so it no longer matches the same path (or remove specific
      # paths from the catchall), redeploy via helm upgrade.
      #
      # Service Kubernetes DNS naming: <service>.<namespace>.svc.cluster.local
      # — the chart already provisions Service objects with replicas: 0 for
      # each of these (see k8s/chart/templates/<service>/service.yaml).
      #
      # - name: view-service
      #   url: http://view-service:8080
      #   routes:
      #     - { name: event-view,        paths: [/api/events/(?:\\d+)/view] }
      #
      # - name: share-service
      #   url: http://share-service:8080
      #   routes:
      #     - { name: event-share,       paths: [/api/events/(?:\\d+)/share] }
      #     - { name: shortlink,         paths: [/api/s/[^/]+$] }
      #
      # - name: notification-service
      #   url: http://notification-service:8080
      #   routes:
      #     - { name: notifications,     paths: [/api/notifications] }
      #     - { name: notification-read, paths: [/api/notifications/(?:\\d+)/read] }
      #

    # ─────────────────────────────────────────────────────────────────────────
    # Global plugins (cf. spec decision 6)
    # ─────────────────────────────────────────────────────────────────────────
    # cors          : allow the SPA running on pinfo6 hosts; permissive enough
    #                 to cover preview namespaces (pr-N.pinfo6.p-info.net) and
    #                 cloudflared tunnel domains used in PR previews.
    # correlation-id: generate (or echo) X-Request-ID — preserves the existing
    #                 RequestIdFilter MDC convention from the monolith
    #                 (application.properties lines 67-69).
    # prometheus    : expose metrics on the kong-proxy /metrics path; scrape
    #                 endpoint kept internal to the cluster.
    plugins:
      - name: cors
        config:
          origins:
            - "https://pinfo6.p-info.net"
            - "https://*.pinfo6.p-info.net"
            - "https://*.trycloudflare.com"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
            - Accept
            - Origin
            - X-Requested-With
            - X-Request-ID
          exposed_headers:
            - X-Request-ID
            - Retry-After
          credentials: true
          max_age: 3600
      - name: correlation-id
        config:
          header_name: X-Request-ID
          generator: uuid
          echo_downstream: true
      - name: prometheus
        config:
          per_consumer: false
          status_code_metrics: true
          latency_metrics: true
          bandwidth_metrics: true
          upstream_health_metrics: true
