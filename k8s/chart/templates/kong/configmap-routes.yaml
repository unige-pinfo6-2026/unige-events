apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: {{ .Release.Namespace }}
data:
  kong.yml: |
    _format_version: "3.0"

    # ─────────────────────────────────────────────────────────────────────────
    # Routing table — strangler-fig step 0
    # ─────────────────────────────────────────────────────────────────────────
    # At step 0 of the microservices migration (cf. specs_microservices_migration.md
    # decision 20), 100% of /api/* traffic is forwarded to the legacy monolith
    # `api:8080`. Subsequent extraction PRs (share-service, view-service, ...)
    # will rewrite this file to route specific paths to the new services while
    # the monolith continues to serve the rest.
    services:
      - name: monolith-api
        url: http://api:8080
        connect_timeout: 5000
        read_timeout: 60000
        write_timeout: 60000
        routes:
          - name: api-catchall
            paths:
              - /api
            strip_path: false
            preserve_host: true
            protocols:
              - http
              - https

      # ───── PR 1 — share-service (extracted) ─────────────────────────────
      # Routes /api/events/{id}/share + /api/s/{shortCode} to share-service.
      # Kong route matching: regex paths outrank prefix paths, so even
      # though /api still matches via api-catchall, Kong picks these
      # specific regexes first.
      - name: share-service
        url: http://share-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: event-share
            paths:
              - ~/api/events/(?:\d+)/share$
            strip_path: false
            preserve_host: true
          - name: shortlink
            paths:
              - ~/api/s/[^/]+$
            strip_path: false
            preserve_host: true

      # ───── PR 2 — view-service (extracted) ──────────────────────────────
      - name: view-service
        url: http://view-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: event-view
            paths:
              - ~/api/events/(?:\d+)/view$
            strip_path: false
            preserve_host: true

      # ───────────────────────────────────────────────────────────────────────
      # Target topology — commented out, ready to flip per extraction PR
      # ───────────────────────────────────────────────────────────────────────
      # The blocks below describe where each path SHOULD route once the
      # corresponding microservice has been extracted from legacy-monolith
      # (cf. specs_microservices_migration.md § "Routage Kong"). To activate
      # one of them: uncomment the block, narrow the `paths` of api-catchall
      # above so it no longer matches the same path (or remove specific
      # paths from the catchall), redeploy via helm upgrade.
      #
      # Service Kubernetes DNS naming: <service>.<namespace>.svc.cluster.local
      # — the chart already provisions Service objects with replicas: 0 for
      # each of these (see k8s/chart/templates/<service>/service.yaml).
      #
      # - name: user-service
      #   url: http://user-service:8080
      #   routes:
      #     - { name: user-me,             paths: [/api/users/me] }
      #     - { name: user-by-id,          paths: [/api/users/(?:[^/]+)$], strip_path: false }
      #     - { name: user-image-banner,   paths: [/api/users/me/image, /api/users/me/banner] }
      #
      # - name: event-service
      #   url: http://event-service:8080
      #   routes:
      #     - { name: events-list,         paths: [/api/events],          strip_path: false }
      #     - { name: events-by-id,        paths: [/api/events/(?:\\d+)], strip_path: false }
      #     - { name: events-cancel,       paths: [/api/events/(?:\\d+)/cancel] }
      #     - { name: events-restore,      paths: [/api/events/(?:\\d+)/restore] }
      #     - { name: events-publish,      paths: [/api/events/(?:\\d+)/publish] }
      #     - { name: events-image,        paths: [/api/events/(?:\\d+)/image] }
      #     - { name: events-occurrences,  paths: [/api/events/(?:\\d+)/occurrences] }
      #     - { name: events-featured,     paths: [/api/events/featured, /api/admin/events/(?:\\d+)/(?:un)?feature] }
      #     - { name: events-search,       paths: [/api/events/search] }
      #
      # - name: attendance-service
      #   url: http://attendance-service:8080
      #   routes:
      #     - { name: attend-actions,    paths: [/api/events/(?:\\d+)/attend, /api/events/(?:\\d+)/attendees] }
      #     - { name: my-attendances,    paths: [/api/users/me/attendances, /api/users/me/participations] }
      #
      # - name: favorite-service
      #   url: http://favorite-service:8080
      #   routes:
      #     - { name: favorite-actions,  paths: [/api/events/(?:\\d+)/favorite] }
      #     - { name: my-favorites,      paths: [/api/users/me/favorites] }
      #
      # - name: view-service
      #   url: http://view-service:8080
      #   routes:
      #     - { name: event-view,        paths: [/api/events/(?:\\d+)/view] }
      #
      # - name: co-organizer-service
      #   url: http://co-organizer-service:8080
      #   routes:
      #     - { name: co-organizers,        paths: [/api/events/(?:\\d+)/co-organizers] }
      #     - { name: co-organizer-userid,  paths: [/api/events/(?:\\d+)/co-organizers/[^/]+$] }
      #     - { name: co-organizer-me,      paths: [/api/events/(?:\\d+)/co-organizers/me/(?:accept|decline)] }
      #     - { name: my-co-org-invites,    paths: [/api/users/me/co-organizer-invitations] }
      #
      # - name: comment-service
      #   url: http://comment-service:8080
      #   routes:
      #     - { name: event-comments,    paths: [/api/events/(?:\\d+)/comments] }
      #     - { name: comment-direct,    paths: [/api/comments/(?:\\d+)] }
      #
      # - name: follow-service
      #   url: http://follow-service:8080
      #   routes:
      #     - { name: follow-actions,    paths: [/api/users/[^/]+/follow] }
      #     - { name: follow-listings,   paths: [/api/users/[^/]+/(?:followers|following)] }
      #     - { name: follow-requests,   paths: [/api/follow-requests/(?:\\d+)/(?:accept|reject)] }
      #     - { name: my-follow-reqs,    paths: [/api/users/me/follow-requests] }
      #
      # - name: report-service
      #   url: http://report-service:8080
      #   routes:
      #     - { name: report-event,      paths: [/api/events/(?:\\d+)/report] }
      #     - { name: admin-reports,     paths: [/api/admin/reports] }
      #     - { name: admin-report-id,   paths: [/api/admin/reports/(?:\\d+)] }
      #
      # - name: stats-service
      #   url: http://stats-service:8080
      #   routes:
      #     - { name: event-stats,       paths: [/api/events/(?:\\d+)/stats] }
      #
      # - name: share-service
      #   url: http://share-service:8080
      #   routes:
      #     - { name: event-share,       paths: [/api/events/(?:\\d+)/share] }
      #     - { name: shortlink,         paths: [/api/s/[^/]+$] }
      #
      # - name: calendar-service
      #   url: http://calendar-service:8080
      #   routes:
      #     - { name: calendar-token,    paths: [/api/users/me/calendar-token] }
      #     - { name: calendar-regen,    paths: [/api/users/me/calendar-token/regenerate] }
      #     - { name: ics-feed,          paths: [/api/calendar/[^/]+\\.ics] }
      #
      # - name: notification-service
      #   url: http://notification-service:8080
      #   routes:
      #     - { name: notifications,     paths: [/api/notifications] }
      #     - { name: notification-read, paths: [/api/notifications/(?:\\d+)/read] }
      #
      # - name: me-aggregator-service
      #   url: http://me-aggregator-service:8080
      #   routes:
      #     # NB: BFF — overlaps with /me paths above. Activate this LAST and
      #     # remove the per-service /me routes from above when the BFF is wired.
      #     - { name: my-events-bff, paths: [/api/users/me/events] }

    # ─────────────────────────────────────────────────────────────────────────
    # Global plugins (cf. spec decision 6)
    # ─────────────────────────────────────────────────────────────────────────
    # cors          : allow the SPA running on pinfo6 hosts; permissive enough
    #                 to cover preview namespaces (pr-N.pinfo6.p-info.net) and
    #                 cloudflared tunnel domains used in PR previews.
    # correlation-id: generate (or echo) X-Request-ID — preserves the existing
    #                 RequestIdFilter MDC convention from the monolith
    #                 (application.properties lines 67-69).
    # prometheus    : expose metrics on the kong-proxy /metrics path; scrape
    #                 endpoint kept internal to the cluster.
    plugins:
      - name: cors
        config:
          origins:
            - "https://pinfo6.p-info.net"
            - "https://*.pinfo6.p-info.net"
            - "https://*.trycloudflare.com"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
            - Accept
            - Origin
            - X-Requested-With
            - X-Request-ID
          exposed_headers:
            - X-Request-ID
            - Retry-After
          credentials: true
          max_age: 3600
      - name: correlation-id
        config:
          header_name: X-Request-ID
          generator: uuid
          echo_downstream: true
      - name: prometheus
        config:
          per_consumer: false
          status_code_metrics: true
          latency_metrics: true
          bandwidth_metrics: true
          upstream_health_metrics: true
