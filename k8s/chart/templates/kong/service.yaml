apiVersion: v1
kind: Service
metadata:
  name: kong-proxy
  namespace: {{ .Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app: kong
  ports:
    - name: proxy
      port: 8000
      targetPort: 8000
    - name: status
      # Internal status / metrics endpoint — kept inside the cluster.
      # Exposed for Prometheus scrapes and the in-cluster readiness probes.
      port: 8100
      targetPort: 8100
