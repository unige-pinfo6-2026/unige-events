apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: notification-service
    migration-step: scaffold
spec:
  # Placeholder service kept at replicas 0 until notification extraction is implemented.
  replicas: 0
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: notification-service
          image: {{ .Values.image.registry }}/{{ .Values.image.org }}/unige-events-notification-service:{{ .Values.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: "Europe/Zurich"
            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.timezone=Europe/Zurich"
            - name: DB_HOST
              value: postgres
            - name: DB_PORT
              value: "5432"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: S3_ENDPOINT
              value: http://minio:9000
          envFrom:
            - secretRef:
                name: app-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
              ephemeral-storage: "128Mi"
            limits:
              memory: "256Mi"
              ephemeral-storage: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/q/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
