apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: notification-service
    migration-step: scaffold
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: notification-service
          image: {{ .Values.image.registry }}/{{ .Values.image.org }}/unige-events-notification-service:{{ .Values.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: "Europe/Zurich"
            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.timezone=Europe/Zurich"
            - name: DB_HOST
              value: {{ if .Values.postgres.shared }}postgres-shared{{ else }}postgres-notification{{ end }}
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: unige_events_notifications
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: S3_ENDPOINT
              value: http://minio:9000
          envFrom:
            - secretRef:
                name: app-secrets
          resources:
            {{- toYaml .Values.notificationService.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /api/q/health/live
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
