apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: unige-events
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: api
          image: ghcr.io/unige-pinfo6-2026/unige-events-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: db
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: DB_PASSWORD
            - name: OIDC_AUTH_SERVER_URL
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: OIDC_AUTH_SERVER_URL
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: OIDC_CLIENT_ID
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: OIDC_CLIENT_SECRET
            - name: OIDC_AUDIENCE
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: OIDC_AUDIENCE
            - name: APP_FRONTEND_URL
              valueFrom:
                secretKeyRef:
                  name: api-secret
                  key: APP_FRONTEND_URL
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: unige-events
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
