apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: sysadmin-cui@unige.ch
    privateKeySecretRef:
      name: letsencrypt-key
    solvers:
      - dns01:
          webhook:
            groupName: acme.duckdns.org
            solverName: duckdns
            config:
              apiTokenSecretRef:
                name: dns-secret
                key: DUCKDNS_TOKEN
