apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: unige-events
  annotations:
    cert-manager.io/cluster-issuer: selfsigned
spec:
  tls:
    - hosts:
        - 10.25.10.136
      secretName: unige-events-tls
  rules:
    - host: 10.25.10.136
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80