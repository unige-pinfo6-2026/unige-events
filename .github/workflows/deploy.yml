name: Deploy

on:
  workflow_call:

permissions:
  contents: read
  packages: read
  pull-requests: write

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Production ───────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    if: github.ref_name == 'main'
    runs-on: deployments
    environment: production
    env:
      NAMESPACE: unige-events

    steps:
      - uses: actions/checkout@v6

      - name: Set kubectl context
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Create namespace
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Doppler token secret
        uses: azure/k8s-create-secret@v6
        with:
          namespace: ${{ env.NAMESPACE }}
          secret-name: doppler-token
          secret-type: generic
          string-data: '{"serviceToken":"${{ secrets.DOPPLER_TOKEN }}"}'

      - name: Create GHCR secret
        uses: azure/k8s-create-secret@v6
        with:
          namespace: ${{ env.NAMESPACE }}
          secret-name: ghcr-secret
          container-registry-url: ${{ env.REGISTRY }}
          container-registry-username: ${{ github.actor }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Deploy
        run: |
          helm upgrade --install ${{ env.NAMESPACE }} ./k8s/chart \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set image.api.tag="${{ github.sha }}" \
            --set image.web.tag="${{ github.sha }}" \
            --timeout 3m \
            --wait

  # ─── Preview ──────────────────────────────────────────────────────────────
  deploy-preview:
    name: Deploy to Preview
    if: github.event_name == 'pull_request'
    runs-on: deployments
    environment: preview
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_NAMESPACE: unige-events-pr-${{ github.event.pull_request.number }}
      PR_HOST: pr-${{ github.event.pull_request.number }}.pinfo6.p-info.net

    steps:
      - uses: actions/checkout@v6

      - name: Set kubectl context
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Create namespace
        run: kubectl create namespace ${{ env.PR_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Doppler token secret
        uses: azure/k8s-create-secret@v6
        with:
          namespace: ${{ env.PR_NAMESPACE }}
          secret-name: doppler-token
          secret-type: generic
          string-data: '{"serviceToken":"${{ secrets.DOPPLER_TOKEN }}"}'

      - name: Create GHCR secret
        uses: azure/k8s-create-secret@v6
        with:
          namespace: ${{ env.PR_NAMESPACE }}
          secret-name: ghcr-secret
          container-registry-url: ${{ env.REGISTRY }}
          container-registry-username: ${{ github.actor }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Deploy
        run: |
          helm upgrade --install ${{ env.PR_NAMESPACE }} ./k8s/chart \
            --namespace ${{ env.PR_NAMESPACE }} \
            --create-namespace \
            -f k8s/chart/values-preview.yaml \
            --set ingress.host="${{ env.PR_HOST }}" \
            --set image.api.tag="pr-${{ env.PR_NUMBER }}" \
            --set image.web.tag="pr-${{ env.PR_NUMBER }}" \
            --timeout 3m \
            --wait

      - name: Set preview context
        id: preview
        run: |
          POD=$(kubectl get pod -l app=cloudflared -n "${{ env.PR_NAMESPACE }}" \
            -o jsonpath='{.items[0].metadata.name}')

          TUNNEL_URL=$(kubectl logs "$POD" -n "${{ env.PR_NAMESPACE }}" -c cloudflared \
            | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' | head -1)

          echo "last_update=$(TZ=Europe/Zurich date '+%b %d, %Y %H:%M %Z')" >> $GITHUB_OUTPUT
          echo "url=$TUNNEL_URL" >> $GITHUB_OUTPUT

      - name: Comment PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ env.PR_NUMBER }}
          message: |
            ## 🚀 Preview Environment Ready

            | Service | URL |
            |--------|-----|
            | 🌐 Frontend | ${{ steps.preview.outputs.url }} |
            | 🔗 API | ${{ steps.preview.outputs.url }}/api |
            | 📦 S3 | ${{ steps.preview.outputs.url }}/s3 |
            ---

            ✅ Deployed from PR #${{ env.PR_NUMBER }}
            🌿 Branch: `${{ github.head_ref }}`
            🔖 Commit: ${{ github.sha }}
            🕒 Updated: ${{ steps.preview.outputs.last_update }}
