name: Deploy

on:
  workflow_call:

permissions:
  contents: read
  packages: read
  pull-requests: write

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Production ───────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    if: github.ref_name == 'main'
    runs-on: self-hosted
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      NAMESPACE: unige-events
      KUBECONFIG: /tmp/kubeconfig-${{ github.run_id }}

    steps:
      - uses: actions/checkout@v6

      - name: Set kubectl context
        run: echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $KUBECONFIG

      - name: Create namespace
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Doppler token secret
        uses: azure/k8s-create-secret@v6
        with:
          namespace: ${{ env.NAMESPACE }}
          secret-name: doppler-token
          secret-type: generic
          string-data: '{"serviceToken":"${{ secrets.DOPPLER_TOKEN }}"}'

      - name: Create GHCR secret
        uses: azure/k8s-create-secret@v6
        with:
          namespace: ${{ env.NAMESPACE }}
          secret-name: ghcr-secret
          container-registry-url: ${{ env.REGISTRY }}
          container-registry-username: ${{ github.actor }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Deploy
        run: |
          helm upgrade --install ${{ env.NAMESPACE }} ./helm \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set image.tag="${{ github.sha }}" \
            --set image.web.tag="${{ github.sha }}" \
            --timeout 6m \
            --wait

  # ─── Preview ──────────────────────────────────────────────────────────────
  deploy-preview:
    name: Deploy to Preview
    if: github.event_name == 'pull_request' && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    environment: preview
    concurrency:
      group: deploy-preview
      cancel-in-progress: false
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_NAMESPACE: unige-events-pr-${{ github.event.pull_request.number }}
      PR_HOST: pr-${{ github.event.pull_request.number }}.pinfo6.p-info.net
      KUBECONFIG: /tmp/kubeconfig-${{ github.run_id }}

    steps:
      - name: Check if Pull Request is still open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_STATUS=$(gh pr view ${{ env.PR_NUMBER }} --repo ${{ github.repository }} --json state --jq .state 2>/dev/null || echo "UNKNOWN")
          echo "Current PR state: $PR_STATUS"
          if [ "$PR_STATUS" != "OPEN" ]; then
            echo "::error::This PR is no longer open (current state: $PR_STATUS). Aborting deployment."
            exit 1
          fi

      - uses: actions/checkout@v6

      - name: Set kubectl context
        run: echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $KUBECONFIG

      - name: Create namespace
        run: kubectl create namespace ${{ env.PR_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Doppler token secret
        uses: azure/k8s-create-secret@v6
        with:
          namespace: ${{ env.PR_NAMESPACE }}
          secret-name: doppler-token
          secret-type: generic
          string-data: '{"serviceToken":"${{ secrets.DOPPLER_TOKEN }}"}'

      - name: Create GHCR secret
        uses: azure/k8s-create-secret@v6
        with:
          namespace: ${{ env.PR_NAMESPACE }}
          secret-name: ghcr-secret
          container-registry-url: ${{ env.REGISTRY }}
          container-registry-username: ${{ github.actor }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v5

      # Self-heal stuck Helm release before upgrading.
      #
      # When a previous deploy run is interrupted (eg. cancelled mid-upgrade,
      # or two PR-title-edits race the same concurrency group), the release
      # gets left in a `pending-*` status. Every subsequent `helm upgrade
      # --install` then bails out immediately with "another operation
      # (install/upgrade/rollback) is in progress" — there is no way for
      # the workflow to make progress without manual cluster intervention.
      #
      # This step detects the stuck state by reading `helm status` and
      # either rolls back to the last successfully-deployed revision (if
      # any exists) or removes the release entirely so the next
      # `helm upgrade --install` can install fresh. Both branches are
      # safe : rollback restores the prior good state, uninstall only
      # runs when there's no prior good state to restore to.
      - name: Clear stuck Helm release (self-heal)
        run: |
          set +e
          status=$(helm status "${{ env.PR_NAMESPACE }}" \
                     --namespace "${{ env.PR_NAMESPACE }}" \
                     --output json 2>/dev/null \
                   | jq -r '.info.status // "absent"')
          echo "Current helm release status: $status"
          case "$status" in
            pending-install|pending-upgrade|pending-rollback)
              echo "::warning::Detected stuck helm release '${{ env.PR_NAMESPACE }}' in $status — clearing before upgrade"
              # Try a rollback first ; if there's no previous revision,
              # uninstall entirely so the next step can fresh-install.
              if ! helm rollback "${{ env.PR_NAMESPACE }}" \
                     --namespace "${{ env.PR_NAMESPACE }}" \
                     --wait --timeout 2m ; then
                echo "Rollback failed — uninstalling stuck release"
                helm uninstall "${{ env.PR_NAMESPACE }}" \
                  --namespace "${{ env.PR_NAMESPACE }}" \
                  --wait --timeout 2m
              fi
              ;;
            *)
              echo "Release is in a clean state ($status) — proceeding"
              ;;
          esac
          # Always exit 0 — the next step is the authoritative deploy.
          exit 0

      - name: Deploy
        run: |
          helm upgrade --install ${{ env.PR_NAMESPACE }} ./helm \
            --namespace ${{ env.PR_NAMESPACE }} \
            --create-namespace \
            -f helm/values-preview.yaml \
            --set ingress.host="${{ env.PR_HOST }}" \
            --set image.tag="${{ github.sha }}" \
            --set image.web.tag="${{ github.sha }}" \
            --timeout 6m \
            --wait

      # Surface pod state on deploy failure to make root-cause analysis
      # tractable from the CI logs
      - name: Diagnose deploy on failure
        if: failure()
        run: |
          set +e
          echo "::group::kubectl get all"
          kubectl -n "${{ env.PR_NAMESPACE }}" get all -o wide
          echo "::endgroup::"
          echo "::group::kubectl describe pods"
          kubectl -n "${{ env.PR_NAMESPACE }}" describe pods
          echo "::endgroup::"
          echo "::group::kubectl logs (containers, current + previous)"
          for pod in $(kubectl -n "${{ env.PR_NAMESPACE }}" get pods -o jsonpath='{.items[*].metadata.name}'); do
            for c in $(kubectl -n "${{ env.PR_NAMESPACE }}" get pod "$pod" -o jsonpath='{.spec.containers[*].name}'); do
              echo "── $pod / $c (current) ──"
              kubectl -n "${{ env.PR_NAMESPACE }}" logs "$pod" -c "$c" --tail=200 2>&1 | sed 's/^/  /'
              echo "── $pod / $c (previous) ──"
              kubectl -n "${{ env.PR_NAMESPACE }}" logs "$pod" -c "$c" --previous --tail=200 2>&1 | sed 's/^/  /'
            done
          done
          echo "::endgroup::"
          echo "::group::kubectl get events"
          kubectl -n "${{ env.PR_NAMESPACE }}" get events --sort-by=.lastTimestamp | tail -50
          echo "::endgroup::"

      - name: Set preview context
        id: preview
        run: |
          POD=$(kubectl get pod -l app=cloudflared -n "${{ env.PR_NAMESPACE }}" \
            -o jsonpath='{.items[0].metadata.name}')

          TUNNEL_URL=$(kubectl logs "$POD" -n "${{ env.PR_NAMESPACE }}" -c cloudflared \
            | grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' | head -1)

          echo "last_update=$(TZ=Europe/Zurich date '+%b %d, %Y %H:%M %Z')" >> $GITHUB_OUTPUT
          echo "url=$TUNNEL_URL" >> $GITHUB_OUTPUT

      - name: Comment PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ env.PR_NUMBER }}
          message: |
            ## 🚀 Preview Environment Ready

            | Service | URL |
            |--------|-----|
            | 🌐 Frontend | ${{ steps.preview.outputs.url }} |
            | 🔗 API | ${{ steps.preview.outputs.url }}/api |
            | 📦 S3 | ${{ steps.preview.outputs.url }}/s3 |
            ---

            ✅ Deployed from PR #${{ env.PR_NUMBER }}
            🌿 Branch: `${{ github.head_ref }}`
            🔖 Commit: ${{ github.sha }}
            🕒 Updated: ${{ steps.preview.outputs.last_update }}
