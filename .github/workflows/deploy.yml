name: Deploy

on:
  workflow_run:
    workflows: ["Build"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    name: Deploy to MicroK8s
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Pull image
        run: echo ${{ secrets.GITHUB_TOKEN }} | microk8s ctr image pull --user ${{ github.actor }}:${{ secrets.GITHUB_TOKEN }} ghcr.io/${{ github.repository }}:latest

      - name: Apply manifests
        run: microk8s kubectl apply -f k8s/

      - name: Restart deployment
        run: |
          microk8s kubectl rollout restart deployment/api -n unige-events
          microk8s kubectl rollout status deployment/api -n unige-events --timeout=120s
