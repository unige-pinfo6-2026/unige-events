name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
  pull_request:
    types: [closed]

permissions:
  contents: read
  packages: read
  pull-requests: write

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Production ───────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: deployments
    environment: production
    env:
      NAMESPACE: unige-events

    steps:
      - uses: actions/checkout@v6

      - name: Set kubectl context
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Create namespace
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Doppler token secret
        uses: azure/k8s-create-secret@v6
        with:
          namespace: ${{ env.NAMESPACE }}
          secret-name: doppler-token
          secret-type: generic
          string-data: '{"serviceToken":"${{ secrets.DOPPLER_TOKEN }}"}'

      - name: Create GHCR secret
        uses: azure/k8s-create-secret@v6
        with:
          namespace: ${{ env.NAMESPACE }}
          secret-name: ghcr-secret
          container-registry-url: ${{ env.REGISTRY }}
          container-registry-username: ${{ github.actor }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Deploy
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          helm upgrade --install ${{ env.NAMESPACE }} ./k8s/chart \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set image.api.tag="${HEAD_SHA}" \
            --set image.web.tag="${HEAD_SHA}" \
            --timeout 3m \
            --wait

  # ─── Preview ──────────────────────────────────────────────────────────────
  deploy-preview:
    name: Deploy Preview
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: deployments
    environment: preview
    env:
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
      PR_NAMESPACE: unige-events-pr-${{ github.event.workflow_run.pull_requests[0].number }}
      PR_HOST: pr-${{ github.event.workflow_run.pull_requests[0].number }}.pinfo6.p-info.net

    steps:
      - uses: actions/checkout@v6

      - name: Set kubectl context
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Create namespace
        run: kubectl create namespace ${{ env.PR_NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Doppler token secret
        uses: azure/k8s-create-secret@v6
        with:
          namespace: ${{ env.PR_NAMESPACE }}
          secret-name: doppler-token
          secret-type: generic
          string-data: '{"serviceToken":"${{ secrets.DOPPLER_TOKEN }}"}'

      - name: Create GHCR secret
        uses: azure/k8s-create-secret@v6
        with:
          namespace: ${{ env.PR_NAMESPACE }}
          secret-name: ghcr-secret
          container-registry-url: ${{ env.REGISTRY }}
          container-registry-username: ${{ github.actor }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Deploy
        run: |
          helm upgrade --install ${{ env.PR_NAMESPACE }} ./k8s/chart \
            --namespace ${{ env.PR_NAMESPACE }} \
            --create-namespace \
            -f k8s/chart/values-preview.yaml \
            --set ingress.host="${{ env.PR_HOST }}" \
            --set image.api.tag="pr-${{ env.PR_NUMBER }}" \
            --set image.web.tag="pr-${{ env.PR_NUMBER }}" \
            --timeout 3m \
            --wait

      - name: Set PR context
        run: |
          echo "TIME=$(TZ=Europe/Zurich date '+%b %d, %Y %H:%M %Z')" >> $GITHUB_ENV

      - name: Comment PR
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ env.PR_NUMBER }}
          message: |
            ## 🚀 Preview Environment Ready

            | Service | URL |
            |--------|-----|
            | 🌐 Frontend | https://${{ env.PR_HOST }} |
            | 🔗 API | https://${{ env.PR_HOST }}/api |
            | 📦 S3 | https://${{ env.PR_HOST }}/s3 |
            ---

            ✅ Deployed from PR #${{ env.PR_NUMBER }}
            🌿 Branch: `${{ github.head_ref }}`
            🔖 Commit: `${{ github.sha }}`
            🕒 Updated: ${{ env.TIME }}

  # ─── Cleanup Preview ──────────────────────────────────────────────────────
  cleanup-preview:
    name: Cleanup Preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: deployments
    environment: preview
    env:
      PR_NAMESPACE: unige-events-pr-${{ github.event.pull_request.number }}

    steps:
      - name: Set kubectl context
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Cleanup
        run: |
          helm uninstall ${{ env.PR_NAMESPACE }} --namespace ${{ env.PR_NAMESPACE }} --ignore-not-found || true
          kubectl delete namespace ${{ env.PR_NAMESPACE }} --ignore-not-found
