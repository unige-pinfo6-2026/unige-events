name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types: [completed]
    branches: [main, develop]

permissions:
  contents: read
  packages: read

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Staging ──────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: deployments
    environment: staging
    env:
      NAMESPACE: unige-events-staging

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set kubectl context
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Create namespace
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Doppler token secret
        uses: azure/k8s-create-secret@v6
        with:
          namespace: ${{ env.NAMESPACE }}
          secret-name: doppler-token
          secret-type: generic
          data: '{"serviceToken":"${{ secrets.DOPPLER_TOKEN }}"}'

      - name: Create GHCR secret
        uses: azure/k8s-create-secret@v6
        with:
          namespace: ${{ env.NAMESPACE }}
          secret-name: ghcr-secret
          container-registry-url: ${{ env.REGISTRY }}
          container-registry-username: ${{ github.actor }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          helm upgrade --install unige-events-staging ./k8s/chart \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            -f k8s/chart/values-staging.yaml \
            --set image.api.tag="${HEAD_SHA}" \
            --set image.web.tag="${HEAD_SHA}" \
            --timeout 3m \
            --wait

  # ─── Production ───────────────────────────────────────────────────────────
  deploy-production:
    name: Deploy to Production
    if: |
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: deployments
    environment: production
    env:
      NAMESPACE: unige-events

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set kubectl context
        uses: azure/k8s-set-context@v5
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Create namespace
        run: kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Doppler token secret
        uses: azure/k8s-create-secret@v6
        with:
          namespace: ${{ env.NAMESPACE }}
          secret-name: doppler-token
          secret-type: generic
          data: '{"serviceToken":"${{ secrets.DOPPLER_TOKEN }}"}'

      - name: Create GHCR secret
        uses: azure/k8s-create-secret@v6
        with:
          namespace: ${{ env.NAMESPACE }}
          secret-name: ghcr-secret
          container-registry-url: ${{ env.REGISTRY }}
          container-registry-username: ${{ github.actor }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Deploy
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          helm upgrade --install unige-events ./k8s/chart \
            --namespace ${{ env.NAMESPACE }} \
            --create-namespace \
            --set image.api.tag="${HEAD_SHA}" \
            --set image.web.tag="${HEAD_SHA}" \
            --timeout 3m \
            --wait
