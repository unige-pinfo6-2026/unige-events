name: Build

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_ADDITIONAL_TAGS: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'latest' }}

jobs:
  # Étape 21 finalization-ultimate (CI-002 — Décision E) : 10 cells matrix
  # consolidée en 1 cellule unique. Toutes les shared libs sont buildées
  # ensemble, puis un seul Sonar scan racine agrège dans le projet
  # `unige-events-backend` (Option B).
  build-shared-libs:
    name: Build All Shared Libs
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Build & Test all shared libs
        # `install` (vs `verify`) place les jars dans le local m2 pour que
        # la matrix backend downstream puisse les résoudre transitivement.
        run: |
          ./mvnw -pl services/shared-rate-limit,services/shared-storage,services/shared-api-error,services/shared-domain-enums,services/shared-domain-dtos,services/shared-domain-projections,services/shared-jaxrs,services/shared-tracing,services/shared-kafka-events,services/shared-platform install -B
      # Étape 22 quality-gate (Étape 1.3) : Sonar scan retiré ici ; coverage
      # remontée à `sonar-aggregate` via les artifacts jacoco.
      - name: Upload jacoco artifacts (shared libs)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-shared-libs
          path: backend/services/shared-*/target/jacoco-report/jacoco.xml
          if-no-files-found: error
          retention-days: 1

  # Étape 21 finalization-ultimate (CI-001 — Décision E) : `-pl .,<svc>-service`
  # ajoute le parent reactor comme top-level project pour que sonar:sonar
  # 4.0.0.4121 trouve un top-level défini. Chaque cellule scanne dans son
  # propre `sonar.projectKey` override (5 projets services dédiés Option B).
  build-backend:
    name: Build Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build-shared-libs
    strategy:
      fail-fast: false
      matrix:
        service:
          - event
          - user
          - engagement
          - moderation
          - notification
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build & Test (with image build/push)
        env:
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # `install` (vs `verify`) place les artefacts dans local m2 pour
          # le Sonar step suivant. Le `.` (parent reactor) est nécessaire
          # pour résoudre le top-level Maven session que sonar:sonar exige.
          ./mvnw -pl .,services/${{ matrix.service }}-service -am install -B \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=${{ github.event_name == 'push' || github.event_name == 'pull_request' }} \
            -Dquarkus.container-image.registry=${{ env.REGISTRY }} \
            -Dquarkus.container-image.group=${{ github.repository_owner }} \
            -Dquarkus.container-image.tag=${{ env.IMAGE_TAG }} \
            -Dquarkus.container-image.additional-tags=${{ env.IMAGE_ADDITIONAL_TAGS }} \
            -Dquarkus.jib.base-jvm-image=eclipse-temurin:21-jre

      # Étape 22 quality-gate (Étape 1.3) : Sonar scan per-cell retiré ;
      # le job sonar-aggregate consomme les artifacts jacoco uploadés ci-dessous.
      - name: Upload jacoco artifact (${{ matrix.service }}-service)
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-${{ matrix.service }}-service
          path: backend/services/${{ matrix.service }}-service/target/jacoco-report/jacoco.xml
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup Docker images
        if: always()
        run: |
          docker volume prune -f
          docker image prune -f

  # Étape 6 — finalization spec : Pact JVM consumer-driven contracts +
  # E2E happy path. Standalone job (no Sonar — Option B aggregates these
  # into the parent unige-events-backend project, which scans during the
  # services matrix runs).
  build-contract-and-e2e:
    name: Build Contract Tests + E2E
    runs-on: ubuntu-latest
    needs: build-shared-libs
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Build & Test contract-tests + e2e
        # -am builds shared-domain-dtos + shared-domain-enums + shared-tracing
        # transitively; surefire produces backend/contract-tests/target/pacts/.
        # E2EHappyPathTest auto-skips without UNIGE_EVENTS_E2E_BASE_URL.
        # `install` (vs `verify`) — alignement Étape 1.2 finalization-ultimate
        # (CI-006) avec les autres jobs de la matrix qui utilisent install
        # pour pousser les artefacts dans le local m2.
        run: ./mvnw -pl contract-tests,e2e -am install -B
      - name: Upload generated pacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacts-${{ github.sha }}
          path: backend/contract-tests/target/pacts/*.json
          if-no-files-found: warn
      # Étape 22 quality-gate (Étape 1.3) : contract-tests + e2e n'ont pas
      # de src/main/java (pure test modules) et ne sont pas des apps Quarkus
      # — quarkus-jacoco n'a rien à instrumenter (Étape 1.2 spec : conditionnelle).
      # On laisse les uploads avec if-no-files-found: warn pour tolérer l'absence
      # tout en restant prêt à les consommer si jacoco est ajouté plus tard.
      - name: Upload jacoco artifact (contract-tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-contract-tests
          path: backend/contract-tests/target/jacoco-report/jacoco.xml
          if-no-files-found: warn
          retention-days: 1
      - name: Upload jacoco artifact (e2e)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-e2e
          path: backend/e2e/target/jacoco-report/jacoco.xml
          if-no-files-found: warn
          retention-days: 1

  # Étape 22 quality-gate (Option B définitive) : un seul scan Sonar agrégé
  # sur le projet `unige-events-backend`, alimenté par les artifacts jacoco
  # uploadés par les jobs amont. Les <sonar.projectKey> per-service ont été
  # retirés (Étape 1.1) — toutes les classes Java main des 17 modules sont
  # scannées dans le seul projet SonarCloud.
  sonar-aggregate:
    name: Sonar Aggregate
    runs-on: ubuntu-latest
    needs:
      - build-shared-libs
      - build-backend
      - build-contract-and-e2e
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          # fetch-depth: 0 nécessaire pour Sonar PR analysis (blame git history).
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      # Re-build (sans tests) pour repeupler le local m2 avec les jars
      # shared-libs + services. Sonar a besoin des .class compilés et du
      # jandex index pour analyser via le sonar-maven-plugin. Le -DskipTests
      # évite le coût ~5 min de re-runner les tests : on a déjà les jacoco
      # reports via les artifacts amont.
      - name: Re-compile reactor (skip tests)
        run: ./mvnw install -DskipTests -B

      # Download des artifacts jacoco dans leurs paths d'origine via
      # merge-multiple. Le pattern jacoco-* matche les artifacts uploadés
      # par les jobs amont ; merge-multiple re-empile les fichiers à leur
      # path source (services/<X>-service/target/jacoco-report/jacoco.xml).
      - name: Download all jacoco artifacts
        uses: actions/download-artifact@v4
        with:
          path: backend
          pattern: jacoco-*
          merge-multiple: true

      # Vérification que les fichiers jacoco.xml sont bien là — au moins
      # 15 (10 shared + 5 services). contract-tests + e2e peuvent légitimement
      # manquer (modules pure-test sans src/main/java — cf. Étape 1.2).
      - name: List jacoco files
        run: |
          find services contract-tests e2e -name jacoco.xml -path '*/jacoco-report/*' 2>/dev/null | sort
          count=$(find services contract-tests e2e -name jacoco.xml -path '*/jacoco-report/*' 2>/dev/null | wc -l)
          echo "Found $count jacoco.xml files"
          [ "$count" -ge 15 ] || (echo "FAIL: expected >= 15 jacoco files" && exit 1)

      # Liste comma-séparée des paths jacoco passée au CLI Sonar (Décision B).
      # Court-circuite le bug `${project.build.directory}` du pom racine qui
      # pointerait sur backend/target/jacoco-report/ (vide post-migration).
      - name: SonarQube Scan (aggregated)
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          JACOCO_PATHS=$(find services contract-tests e2e -name jacoco.xml -path '*/jacoco-report/*' 2>/dev/null | paste -sd ',')
          echo "Sonar coverage paths: $JACOCO_PATHS"
          ./mvnw -pl . sonar:sonar -B \
              -Dsonar.coverage.jacoco.xmlReportPaths=$JACOCO_PATHS

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 24
      FRONTEND_IMAGE: unige-events-web
      MODE: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Nécessaire pour SonarQube

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build
        run: npm run build -- --mode ${{ env.MODE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup Docker images
        if: always()
        run: |
          docker volume prune -f
          docker image prune -f
