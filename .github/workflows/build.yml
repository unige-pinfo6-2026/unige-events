name: Build

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_TAG: ${{ github.sha }}
  IMAGE_ADDITIONAL_TAGS: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'latest' }}

jobs:
  # Étape 7 — finalization spec : matrix per shared lib (10 cells).
  # Builds + tests each shared lib independently, then runs Sonar with
  # its own sonar.projectKey override (set in each module's pom.xml).
  build-shared-libs:
    name: Build Shared Lib (${{ matrix.lib }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lib:
          - shared-rate-limit
          - shared-storage
          - shared-api-error
          - shared-domain-enums
          - shared-domain-dtos
          - shared-domain-projections
          - shared-jaxrs
          - shared-tracing
          - shared-kafka-events
          - shared-platform
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Build & Test
        # `install` (vs `verify`) places the shared lib + its inter-lib
        # dependencies into this runner's local m2 repository so the
        # follow-up `sonar:sonar` invocation can resolve them — without
        # `install`, sonar:sonar fails with
        # "Could not find artifact ch.unige.events:shared-XXX:1.0-SNAPSHOT".
        run: ./mvnw -pl services/${{ matrix.lib }} -am install -B
      - name: SonarQube Scan
        # continue-on-error: tant que DevOps n'a pas créé les 5 SonarCloud
        # projects services post-consolidation (Option B — les 10 shared
        # libs scannent dans le projet unige-events-backend, qui existe
        # déjà ; cf. backend/docs/devops-handoff.md item 1), ce step
        # peut échouer côté services. On ne veut pas que ça bloque la
        # matrix backend downstream qui dépend de ce job via `needs:`.
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -pl services/${{ matrix.lib }} sonar:sonar -B

  # Étape 7 — finalization spec : matrix per service (5 cells, post-consolidation 14→5).
  # Each cell builds + tests + (optionally) pushes the service image.
  build-backend:
    name: Build Backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: build-shared-libs
    strategy:
      fail-fast: false
      matrix:
        service:
          - event
          - user
          - engagement
          - moderation
          - notification
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build & Test (with image build/push)
        env:
          QUARKUS_CONTAINER_IMAGE_USERNAME: ${{ github.actor }}
          QUARKUS_CONTAINER_IMAGE_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Each module pins its own quarkus.container-image.name in its
          # application.properties, so the reactor builds N images named
          # unige-events-<service>:<sha>.
          # `install` (vs `verify`) places the service jar + its shared
          # lib dependencies into this runner's local m2 so the follow-up
          # sonar:sonar invocation can resolve them.
          ./mvnw -pl services/${{ matrix.service }}-service -am install -B \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.push=${{ github.event_name == 'push' || github.event_name == 'pull_request' }} \
            -Dquarkus.container-image.registry=${{ env.REGISTRY }} \
            -Dquarkus.container-image.group=${{ github.repository_owner }} \
            -Dquarkus.container-image.tag=${{ env.IMAGE_TAG }} \
            -Dquarkus.container-image.additional-tags=${{ env.IMAGE_ADDITIONAL_TAGS }} \
            -Dquarkus.jib.base-jvm-image=eclipse-temurin:21-jre

      - name: SonarQube Scan
        # continue-on-error : cf. note dans build-shared-libs.SonarQube Scan.
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./mvnw -pl services/${{ matrix.service }}-service sonar:sonar -B

      - name: Cleanup Docker images
        if: always()
        run: |
          docker volume prune -f
          docker image prune -f

  # Étape 6 — finalization spec : Pact JVM consumer-driven contracts +
  # E2E happy path. Standalone job (no Sonar — Option B aggregates these
  # into the parent unige-events-backend project, which scans during the
  # services matrix runs).
  build-contract-and-e2e:
    name: Build Contract Tests + E2E
    runs-on: ubuntu-latest
    needs: build-shared-libs
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          cache: maven
      - name: Build & Test contract-tests + e2e
        # -am builds shared-domain-dtos + shared-domain-enums + shared-tracing
        # transitively; surefire produces backend/contract-tests/target/pacts/.
        # E2EHappyPathTest auto-skips without UNIGE_EVENTS_E2E_BASE_URL.
        run: ./mvnw -pl contract-tests,e2e -am verify -B
      - name: Upload generated pacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pacts-${{ github.sha }}
          path: backend/contract-tests/target/pacts/*.json
          if-no-files-found: warn

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    env:
      NODE_VERSION: 24
      FRONTEND_IMAGE: unige-events-web
      MODE: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Nécessaire pour SonarQube

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        with:
          projectBaseDir: frontend
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Build
        run: npm run build -- --mode ${{ env.MODE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Cleanup Docker images
        if: always()
        run: |
          docker volume prune -f
          docker image prune -f
