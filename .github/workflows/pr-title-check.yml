name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    name: Lint PR title
    runs-on: ubuntu-latest

    steps:
      - name: Validate PR title format
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            test
            chore
            ci
            perf
          requireScope: false
          subjectPattern: "^[a-z].+"
          subjectPatternError: |
            Le titre de la PR ne respecte pas la convention attendue.

            Format requis : <type>(<scope>): <description>
              - <type> obligatoire parmi : feat, fix, docs, style, refactor, test, chore, ci, perf
              - <scope> optionnel, entre parenthèses, en lowercase (ex. backend, frontend, scrum-133)
              - description obligatoire, commençant par une minuscule

            Exemples valides :
              - feat(backend): add /users/me/events endpoint
              - fix(frontend): preserve returnTo on protected routes
              - chore(ci): add PR title check workflow
              - docs: update sprint context for S7

            Titre reçu : "{subject}"
