name: Bug Report
description: Report a bug
title: "[BUG] "
type: "Bug"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this bug. Please fill in the fields below with as much detail as possible.

  - type: input
    id: summary
    attributes:
      label: Bug Summary
      description: A short and clear description of the issue.
      placeholder: e.g. The login button is unresponsive
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Describe the steps to reproduce the bug.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Observe the error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should normally happen?
      placeholder: e.g. The user should be redirected to the dashboard.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happens?
      placeholder: e.g. The page goes blank and no error is displayed.
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (blocking)
        - Major (degraded functionality)
        - Minor (visual or cosmetic issue)
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, browser, app version, etc.
      placeholder: e.g. Windows 11 / Chrome 123 / v2.4.1
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Add any useful elements (logs, screenshots, videos).
      placeholder: Paste your logs here or drag and drop your files.
    validations:
      required: false