      operationId: getEvents
      x-owner-service: event-service
      tags: [events]
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EventStatus'
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/EventCategory'
        - name: organizerId
          in: query
          description: |
            Filtre les événements par créateur (UUID). **Contrainte de sécurité** : lorsque
            `organizerId` est présent, seul `status=PUBLISHED` est autorisé. Si `organizerId` est
            passé sans `status`, le filtre implicite `status=PUBLISHED` est appliqué. Toute
            combinaison avec `status=DRAFT` ou `status=CANCELLED` renvoie `400
            organizer_filter_requires_published`. Pour lister ses propres événements dans
            n'importe quel statut, utiliser `GET /users/me/events`.
          schema:
            type: string
            format: uuid
        - name: endDateFrom
          in: query
          description: Filtre les événements dont endDate >= endDateFrom (datetime ISO local, ex. 2026-04-01T16:57:00). Utilisé par la page d'accueil pour masquer les événements terminés.
          schema:
            type: string
            format: date-time
        - name: faculty
          in: query
          description: Filtre les événements par faculté
          schema:
            $ref: '#/components/schemas/Faculty'
        - name: facultyNone
          in: query
          description: |
            Si true, retourne uniquement les événements dont `faculty` est null
            (non rattachés à une faculté précise). Mutuellement exclusif avec le
            paramètre `faculty` — si les deux sont fournis, `facultyNone` a priorité.
          schema:
            type: boolean
        - name: featured
          in: query
          description: Si true, retourne uniquement les événements actuellement mis en avant (featured=true). Utile pour le dashboard admin.
          schema:
            type: boolean
        - name: followedOnly
          in: query
          description: |
            SCRUM-168 — filtre du feed d'abonnements.
            Si `true`, retourne uniquement les événements dont le créateur est suivi
            (statut ACCEPTED) par l'utilisateur authentifié.
            - Requiert une authentification : si l'appelant est anonyme → `401`.
            - Si l'utilisateur ne suit personne → retourne `[]` (pas d'erreur).
            - Compatible avec tous les autres filtres (`status`, `category`, `endDateFrom`, etc.).
            - Absent ou `false` → comportement inchangé (tous les événements).
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Liste des événements (array brut)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '400':
          description: |
            Combinaison de paramètres de requête invalide. Codes d'erreur possibles dans `error` :
            - `organizer_filter_requires_published` : `organizerId` combiné avec un statut non-PUBLISHED.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: |
            Token absent ou invalide. Renvoyé uniquement quand `followedOnly=true` est passé
            par un appelant non authentifié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

    post:
      summary: Créer un événement
      description: Crée un nouvel événement. Authentification requise — le créateur est l'utilisateur connecté.
      operationId: createEvent
      x-owner-service: event-service
      tags: [events]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventRequest'
      responses:
        '201':
          description: Événement créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: |
            Validation échouée. Pour la récurrence (SCRUM-147) :
            - Bean Validation generic : `frequency` manquant, `maxOccurrences` hors [1,52], `startDate` non-future.
            - `error: "recurrence_unbounded"` : `recurrence` présent mais ni `endDate` ni `maxOccurrences` renseignés.
            - `error: "recurrence_end_before_start"` : `recurrence.endDate < startDate.toLocalDate()`.

            Note : un cap dur de 52 occurrences (parent inclus) s'applique côté générateur ;
            si le calcul `endDate × frequency` produit plus de 52 occurrences, la récurrence
            est silencieusement tronquée à 52 (pas d'erreur). La borne client `maxOccurrences > 52`
            est en revanche rejetée par Bean Validation côté DTO (`@Max(52)`).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Profil utilisateur introuvable (appeler GET /users/me d'abord)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /events/search:
    get:
      summary: Recherche full-text d'événements
      description: |
        Recherche insensible à la casse (ILIKE) sur le titre et la description.
        Filtres optionnels : category, faculty, plage de dates (startDate), tags.
      operationId: searchEvents
      x-owner-service: event-service
      tags: [events]
      security: []
      parameters:
        - name: q
          in: query
          description: Terme de recherche full-text (insensible à la casse, cherche dans title et description)
          schema:
            type: string
        - name: category
          in: query
          schema:
            $ref: '#/components/schemas/EventCategory'
        - name: faculty
          in: query
          description: Filtre les événements par faculté
          schema:
            $ref: '#/components/schemas/Faculty'
        - name: facultyNone
          in: query
          description: |
            Si true, retourne uniquement les événements dont `faculty` est null
            (non rattachés à une faculté précise). Mutuellement exclusif avec le
            paramètre `faculty` — si les deux sont fournis, `facultyNone` a priorité.
          schema:
            type: boolean
        - name: tags
          in: query
          description: |
            Filtre les événements dont au moins un tag **contient** (substring match, case-insensitive)
            au moins une des valeurs fournies. Sémantique OR entre les valeurs (ex. `?tags=foot` matche
            un event dont un tag est `football` ou `barefoot-running`).
            Les caractères `%` et `_` saisis par l'utilisateur sont traités littéralement (échappés
            côté serveur pour ne pas être interprétés comme wildcards SQL).
            Multi-valeurs via répétition du paramètre : `?tags=foo&tags=bar`.
            Les valeurs blanches/vides sont ignorées silencieusement.
          schema:
            type: array
            items:
              type: string
              maxLength: 64
          style: form
          explode: true
        - name: dateFrom
          in: query
          description: Filtre les événements dont startDate >= dateFrom (début de journée, 00:00:00)
          schema:
            type: string
            format: date
        - name: dateTo
          in: query
          description: Filtre les événements dont startDate <= dateTo (fin de journée, 23:59:59)
          schema:
            type: string
            format: date
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Résultats de la recherche (tableau vide si aucun résultat — jamais 404)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'

  /events/{id}:
    get:
      summary: Détail d'un événement
      description: |
        Retourne le détail d'un événement.

        **Règle d'autorisation** : seuls les événements `PUBLISHED` sont accessibles
        anonymement. Les événements `DRAFT` ou `CANCELLED` ne sont visibles que par
        leur créateur, **un co-organisateur ACCEPTED** (cf. SCRUM-136), ou un
        administrateur (rôle `ADMIN`). Dans tout autre cas —
        appelant anonyme, appelant authentifié non-créateur non-co-org non-admin, ou
        appelant authentifié dont le profil n'est pas provisionné — le serveur renvoie
        `404 not_found`, envelope identique à celle pour un ID inexistant (évite un
        oracle d'existence — cf. pentest 2026-04-17 findings 4.12 + 4.15).

        **SCRUM-97 — events `BANNED`** : invisibles via cet endpoint pour TOUT LE MONDE,
        anonyme, créateur et admin compris. Le drill-down sur un event banni passe
        exclusivement par la table de modération (`/admin/reports`). La réponse 404
        utilise la même envelope que pour un ID inexistant — pas de leak du fait que
        l'event a été banni.
      operationId: getEventById
      x-owner-service: event-service
      tags: [events]
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Détail de l'événement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '404':
          description: |
            Événement introuvable, OU événement en statut `DRAFT` / `CANCELLED`
            demandé par un appelant qui n'en est ni le créateur ni un admin.
            Le corps est identique dans les deux cas (pas d'oracle d'existence).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

    put:
      summary: Modifier un événement (créateur ou co-organisateur ACCEPTED) — mise à jour complète
      description: |
        Réservé au créateur **ou à un co-organisateur ACCEPTED** (cf. SCRUM-136 cascade
        `isCreatorOrAcceptedCoOrganizer`). Renvoie 403 pour tout autre appelant authentifié.
      operationId: updateEvent
      x-owner-service: event-service
      tags: [events]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventRequest'
      responses:
        '200':
          description: Événement mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Validation échouée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Appelant ni créateur ni co-organisateur ACCEPTED (cf. SCRUM-136 cascade)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflit — l'événement est annulé et ne peut pas être modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

    delete:
      summary: Supprimer définitivement un événement annulé (hard-delete)
      description: |
        Supprime définitivement l'événement de la base. Opération irréversible.
        L'événement doit être en statut CANCELLED — sinon 409. Pour annuler un événement,
        utiliser PATCH /events/{id}/cancel d'abord.

        **Réservé au créateur** (suppression physique d'un CANCELLED — non délégable aux
        co-organisateurs ACCEPTED, cf. SCRUM-136 décision 2 : la cascade ne s'étend pas
        aux actions irréversibles).
      operationId: deleteEvent
      x-owner-service: event-service
      tags: [events]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Événement supprimé définitivement
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: |
            Appelant non créateur. Le hard-delete reste strict-creator — non délégable
            aux co-organisateurs ACCEPTED (cf. SCRUM-136 décision 2 : action irréversible
            hors scope du « partage de gestion »).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflit — l'événement n'est pas en statut CANCELLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /events/{id}/occurrences:
    get:
      summary: Lister les occurrences d'un événement parent récurrent (SCRUM-147)
      description: |
        Retourne la liste des événements dont `parentEventId` matche `{id}`, triés par
        `startDate ASC, id ASC`. Si l'event ciblé n'est pas un parent récurrent
        (occurrence elle-même, standalone non-récurrent, ou parent sans occurrences
        encore générées), retourne `200 OK` + `[]` — pas de `404`. Le client lit
        `event.recurrenceRule != null` sur `GET /events/{id}` pour distinguer un parent.

        **Visibilité** : passe par `EventService.getById(id, callerAuth0Id, isAdmin)`.
        Un event invisible (DRAFT non-créateur, CANCELLED non-créateur, BANNED, id
        inconnu) retourne `404 not_found` (anti-oracle ISSUE-92).
      operationId: getEventOccurrences
      x-owner-service: event-service
      tags: [events]
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 52
            default: 52
      responses:
        '200':
          description: Liste des occurrences (vide si pas de parent récurrent)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '400':
          description: Pagination invalide (`size > 52`, `page < 0`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Event invisible (DRAFT non-créateur, CANCELLED non-créateur, BANNED, id inconnu)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /events/{id}/cancel:
    patch:
      summary: Annuler un événement (DRAFT/PUBLISHED → CANCELLED)
      description: |
        Passe le statut de l'événement à CANCELLED. L'événement reste en base et
        demeure interrogeable. Réservé au créateur **ou à un co-organisateur ACCEPTED**
        (cf. SCRUM-136 cascade). Retourne 409 si déjà annulé.
      operationId: cancelEvent
      x-owner-service: event-service
      tags: [events]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Événement annulé — retourne l'EventDTO avec status CANCELLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Appelant ni créateur ni co-organisateur ACCEPTED (cf. SCRUM-136 cascade)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflit — l'événement est déjà annulé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /events/{id}/restore:
    patch:
      summary: Restaurer un événement annulé (CANCELLED → DRAFT)
      description: |
        Remet un événement annulé au statut DRAFT. Réservé au créateur **ou à un
        co-organisateur ACCEPTED** (cf. SCRUM-136 cascade).
        Retourne 409 si l'événement n'est pas en statut CANCELLED.
      operationId: restoreEvent
      x-owner-service: event-service
      tags: [events]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Événement restauré — retourne l'EventDTO avec status DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Appelant ni créateur ni co-organisateur ACCEPTED (cf. SCRUM-136 cascade)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflit — l'événement n'est pas en statut CANCELLED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /events/{id}/publish:
    patch:
      summary: Publier un événement (DRAFT → PUBLISHED)
      description: |
        Passe le statut de l'événement de DRAFT à PUBLISHED.
        Accessible à tout utilisateur authentifié — le service vérifie ensuite
        que l'appelant est le créateur de l'événement, **un co-organisateur ACCEPTED**
        (cf. SCRUM-136 cascade), ou un administrateur.
        Retourne 409 si l'événement n'est pas en statut DRAFT (déjà publié ou annulé).
      operationId: publishEvent
      x-owner-service: event-service
      tags: [events]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Événement publié — retourne l'EventDTO complet avec status PUBLISHED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Appelant ni créateur, ni co-organisateur ACCEPTED, ni ADMIN (cf. SCRUM-136 cascade)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Conflit — l'événement n'est pas en statut DRAFT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: |
            Échec de validation — l'événement ne remplit pas les conditions requises pour être publié
            (titre, lieu, catégorie, date de début future, date de fin cohérente). Le corps contient
            la liste des erreurs à corriger dans `errors`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: validation_failed
                  errors:
                    type: array
                    items:
                      type: string
                    example:
                      - La date de l'événement doit être dans le futur
                      - Le titre est obligatoire
        '429':
          $ref: '#/components/responses/RateLimited'

  /events/{id}/duplicate:
    post:
      summary: Dupliquer un événement existant (clone DRAFT, dates +7 jours)
      description: |
        Crée une copie de l'événement source avec :
        - `status = DRAFT` (toujours, indépendamment du status source — sauf BANNED, refusé en 403)
        - `title = "Copie de <source.title>"` avec dédup via suffixe `(2)`, `(3)`, …, cap N=100
          (au-delà : `422 duplicate_title_collision`)
        - `startDate` et `endDate` décalées de `+7 jours`
        - `creatorId = <caller.id>` (le duplicateur devient organisateur du clone, cf. SCRUM-99 Décision N)
        - `recurrenceRule`, `parentEventId`, `registrationDeadline`, `shareCode`, `featured`,
          `featuredAt` réinitialisés à `null`/`false`
        - Tags copiés (deep copy) ; aucune cascade sur attendances, favorites, views,
          co-organisateurs, comments, reports, attachments (le clone démarre vierge)

        Réservé au créateur, à un co-organisateur ACCEPTED (cascade SCRUM-136), ou à un
        administrateur. Aucune émission Kafka (DRAFT ≠ PUBLISHED).
      operationId: duplicateEvent
      x-owner-service: event-service
      tags: [events]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: ID de l'événement source à dupliquer
          schema:
            type: integer
            format: int64
      responses:
        '201':
          description: Event dupliqué — retourne le clone (status DRAFT, dates +7j)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Requête invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: |
            Appelant ni créateur, ni co-organisateur ACCEPTED, ni ADMIN ; ou source
            `BANNED` (un event banni ne se duplique pas, même par un admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement source introuvable (anti-oracle DRAFT/CANCELLED pour non-créateurs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: |
            Collision de title persistante — `Copie de X (1)` jusqu'à `Copie de X (100)`
            sont tous déjà pris par cet organisateur. Code applicatif : `duplicate_title_collision`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /events/{id}/image:
    post:
      summary: Upload de la bannière d'un événement (créateur, co-organisateur ACCEPTED ou ADMIN)
      description: |
        Upload une bannière (image multipart) pour un événement.
        Réservé au créateur, **à un co-organisateur ACCEPTED** (cf. SCRUM-136 cascade),
        ou à un administrateur.
      operationId: uploadEventImage
      x-owner-service: event-service
      tags: [events]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Bannière uploadée — retourne l'événement mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: |
            Validation/upload error. Codes possibles :
            - `validation_error` (`ValidationErrorResponse`) : champ multipart `file` absent (mauvais nom de champ ou body vide). Réponse retournée par défaut depuis pentest 2026-04-17 finding 4.22 pour éviter le 500 par NPE.
            - `invalid_file_type` (`ApiErrorResponse`) : type MIME non autorisé (acceptés : image/jpeg, image/png, image/webp, image/gif).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Appelant ni créateur, ni co-organisateur ACCEPTED, ni ADMIN (cf. SCRUM-136 cascade)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '413':
          description: Fichier trop volumineux — dépasse la limite de 5 MB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /events/{eventId}/attachments:
    post:
      summary: Uploader un fichier joint à un événement (SCRUM-148)
      description: |
        Upload un fichier joint (multipart/form-data) à un événement.
        Réservé au créateur, à un co-organisateur ACCEPTED (cf. SCRUM-136 cascade)
        ou à un ADMIN.

        **Whitelist MIME** : `application/pdf`, `application/msword`,
        `application/vnd.openxmlformats-officedocument.wordprocessingml.document`,
        `application/vnd.openxmlformats-officedocument.spreadsheetml.sheet`,
        `image/png`, `image/jpeg` (PNG/JPEG ajoutés en SCRUM-149 — V14 migration).

        **Limites** :
        - `file.size <= 10 MiB` (10 485 760 bytes) — sinon 422 `attachment_invalid_size`.
        - `count(event_attachments WHERE event_id = ?) < 5` — sinon 422 `attachment_limit_exceeded`.

        **Rate-limit** : `@PerUserRateLimit(name="events.uploadAttachment", max=10, windowSeconds=60)`.

        **Validation MIME** : header uniquement (pas de validation magic-number
        pour les non-images — Décision S, risque mineur documenté). Les images
        ajoutées en SCRUM-149 passent par la même voie `saveFile` (pas
        `saveImage`), donc également sans magic-number — risque homogène.
      operationId: uploadEventAttachment
      x-owner-service: event-service
      tags: [events]
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PDF / DOC / DOCX / XLSX. Max 10 MiB.
      responses:
        '201':
          description: Attachment uploadé — retourne le DTO
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentDTO'
        '400':
          description: Body multipart absent ou champ `file` manquant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Caller ni créateur, ni co-organisateur ACCEPTED, ni ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement introuvable (anti-oracle ISSUE-92 propagé)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '413':
          description: Payload multipart dépasse la limite serveur Quarkus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: |
            Erreur sémantique. Codes possibles :
            - `attachment_invalid_size` : `file.size > 10485760` (10 MiB).
            - `attachment_invalid_type` : MIME hors whitelist PDF/DOC/DOCX/XLSX.
            - `attachment_limit_exceeded` : déjà 5 attachments sur cet event.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /events/{eventId}/attachments/{attachmentId}:
    delete:
      summary: Supprimer un fichier joint (SCRUM-148)
      description: |
        Supprime un attachment. Cascade DB (FK `event_attachments ON DELETE CASCADE`
        sur `events`) + best-effort cleanup S3 hors-transaction (log WARN sur échec —
        objet orphelin S3 acceptable).

        **Autorisé pour** :
        1. le créateur de l'event,
        2. un co-organisateur ACCEPTED (cascade SCRUM-136),
        3. un ADMIN,
        4. l'**uploader original** de cet attachment (un co-org peut retirer son propre upload).

        **Anti-oracle 404** : `attachmentId` valide mais appartenant à un autre `eventId`
        (path mismatch) → 404 envelope identique à `attachmentId` inexistant.
      operationId: deleteEventAttachment
      x-owner-service: event-service
      tags: [events]
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: attachmentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Attachment supprimé (no body)
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Caller ni créateur, ni co-organisateur ACCEPTED, ni ADMIN, ni uploader original
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Attachment inexistant OU path mismatch (anti-oracle)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /events/{eventId}/attachments/{attachmentId}/download:
    get:
      summary: Télécharger un fichier joint (SCRUM-149 follow-up)
      description: |
        Public — pas d'authentification requise (les attachments suivent
        la visibilité de la page détail de l'événement). Le backend relit
        l'objet depuis MinIO/S3 via `FileStorageService.downloadObject`
        puis le streame avec :

        - `Content-Type: <mimeType>` du DTO (PDF/DOC/DOCX/XLSX/PNG/JPEG),
        - `Content-Disposition: attachment; filename="<fileName>"; filename*=UTF-8''<encoded>`
          → force le navigateur à télécharger au lieu d'afficher inline,
        - `Cache-Control: private, max-age=300` (cache navigateur 5 min).

        Cet endpoint existe parce que `fileUrl` pointe sur l'endpoint
        MinIO interne (`minio:9000`) qui n'est pas exposé publiquement,
        et parce que l'attribut HTML `<a download>` est ignoré sur les
        URLs cross-origin (spec navigateur). Le frontend doit utiliser
        `AttachmentDTO.downloadUrl` (qui pointe ici) à la place de
        `fileUrl`.

        **Anti-oracle 404** : `attachmentId` valide mais appartenant à
        un autre `eventId` → 404 (path mismatch indissociable d'inexistence).
        Pareil pour les events en statut `BANNED` (toujours masqué, même
        aux admins) ou non-`PUBLISHED` quand l'appelant n'est ni admin,
        ni créateur, ni co-organisateur ACCEPTED — alignement avec la
        règle de `GET /events/{id}`. Les appelants anonymes ne peuvent
        télécharger que des fichiers d'events `PUBLISHED`.
      operationId: downloadEventAttachment
      tags: [events]
      security: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: attachmentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Bytes du fichier (binaire)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/msword:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
        '404':
          description: |
            Attachment inexistant, path mismatch (anti-oracle), OU objet S3
            absent (GCed indépendamment de la row DB).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '503':
          description: Backend S3 injoignable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /events/featured:
    get:
      summary: Événements mis en avant et populaires
      description: |
        Retourne jusqu'à `limit` événements via une logique deux phases.
        Phase 1 : événements avec `featured=true`, statut PUBLISHED et `endDate >= now()`, triés par `featuredAt DESC` (critère interne — `featuredAt` est exposé dans le schéma Event en lecture seule).
        Phase 2 : complète les slots restants avec les événements non-featured PUBLISHED à venir,
        triés par score de popularité (`attendingCount + favoriteCount`) DESC. Les IDs de la phase 1
        sont exclus de la phase 2.
      operationId: getFeaturedEvents
      x-owner-service: event-service
      tags: [events]
      security: []
      parameters:
        - name: limit
          in: query
          description: Nombre maximum d'événements retournés (min 1, max 12).
          schema:
            type: integer
            default: 6
            minimum: 1
            maximum: 12
      responses:
        '200':
          description: Liste des événements mis en avant / populaires
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '400':
          description: Paramètre limit hors bornes (< 1 ou > 12)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

