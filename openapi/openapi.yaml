        '404':
          description: Événement introuvable, ou profil utilisateur non provisionné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Cet utilisateur a déjà signalé cet événement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: |
            `cannot_report_own_event` — l'utilisateur est créateur ou co-organisateur
            ACCEPTED de l'événement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /events/{eventId}/comments:
    post:
      summary: Poster un commentaire sur un événement (SCRUM-139)
      description: |
        Crée un commentaire (`Comment`) sur l'event ciblé (`eventId`), au nom du caller authentifié.

        Si `parentCommentId` est renseigné, le commentaire est une **reply** au commentaire
        identifié — celui-ci doit appartenir au même event ET être un top-level (profondeur max 1).

        **Visibilité** : passe par `EventService.getById(eventId, callerAuth0Id, isAdmin)`.
        Un event invisible (DRAFT non-créateur, CANCELLED non-créateur, BANNED, id inconnu)
        retourne `404 not_found` (anti-oracle ISSUE-92).

        Codes d'erreur :
        - `400 cannot_comment_draft_event` : POST par créateur/co-org/admin sur event DRAFT.
        - `400 cannot_comment_cancelled_event` : event CANCELLED.
        - `400 cannot_comment_expired_event` : event EXPIRED.
        - `401 unauthorized` : token absent ou invalide.
        - `404 not_found` : event invisible (DRAFT non-créateur, CANCELLED non-créateur, BANNED, id inconnu).
        - `404 parent_comment_not_found` : `parentCommentId` inexistant.
        - `422 replies_too_deep` : `parentCommentId` réfère un commentaire qui a déjà un parent.
        - `422 parent_comment_not_in_event` : `parentCommentId` réfère un commentaire d'un autre event.
        - `429 rate_limited` : `@PerUserRateLimit(name="comments.post", max=10, windowSeconds=60)` dépassé.
      operationId: postComment
      x-owner-service: engagement-service
      tags: [comments]
      security:
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Commentaire créé (replies vide)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentDTO'
        '400':
          description: Event non commentable (DRAFT/CANCELLED/EXPIRED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Event invisible OU `parentCommentId` inexistant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: Profondeur de reply dépassée OU parent dans un autre event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

    get:
      summary: Lister les commentaires d'un événement (SCRUM-139)
      description: |
        Retourne une page paginée des commentaires top-level de l'event ciblé,
        avec leurs replies imbriquées dans `replies[]` (max 1 niveau de profondeur).
        Tri : `createdAt DESC, id DESC` (commentaires les plus récents en premier).

        **Visibilité** : héritée de `EventService.getById` — événement invisible → `404`.
        Endpoint `@PermitAll` : un anonyme reçoit la liste (l'event PUBLISHED est public).

        **Pagination** : `page` (default 0, ≥ 0), `size` (default 20, > 0, ≤ 100).
      operationId: getEventComments
      x-owner-service: engagement-service
      tags: [comments]
      security:
        - {}
        - BearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Page de commentaires (top-level + replies imbriquées)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentDTO'
        '400':
          description: Pagination invalide (`size > 100`, `page < 0`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '404':
          description: Event invisible (DRAFT non-créateur, CANCELLED non-créateur, BANNED, id inconnu)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /comments/{commentId}:
    delete:
      summary: Supprimer un commentaire (SCRUM-139)
      description: |
        Supprime physiquement le commentaire (`commentId`). DELETE physique — la row part
        définitivement. Si le commentaire avait des replies, celles-ci sont conservées
        et leur `parent_comment_id` est mis à `NULL` côté DB via la clause `ON DELETE
        SET NULL` de la FK `fk_comments_parent`. Conséquence : ces replies remontent en
        **top-level** dans `GET /events/{eventId}/comments` et apparaissent au prochain
        appel comme des commentaires de premier niveau (`parentCommentId: null` côté DTO).

        **Autorisé pour** :
        1. l'auteur du commentaire (`comment.author.id == caller.id`),
        2. le créateur de l'event (`comment.event.creator.id == caller.id`),
        3. un co-organisateur ACCEPTED de l'event (cascade SCRUM-136),
        4. un utilisateur ADMIN (claim Auth0).

        Codes d'erreur :
        - `401 unauthorized` : token absent ou invalide.
        - `403 forbidden` : caller authentifié mais non autorisé.
        - `404 comment_not_found` : `commentId` inexistant.
      operationId: deleteComment
      x-owner-service: engagement-service
      tags: [comments]
      security:
        - BearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Commentaire supprimé (no body)
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Caller non autorisé (`error=forbidden`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Commentaire inexistant (`error=comment_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /comments/{commentId}/like:
    post:
      summary: Liker un commentaire (SCRUM-144, idempotent)
      description: |
        Pose un like sur le commentaire pour le caller authentifié. **Idempotent** :
        un 2e POST du même caller sur le même commentaire retourne 200 (au lieu de 201)
        sans incrémenter `likeCount`. Race-safe : 2 POSTs simultanés produisent 1 row
        `comment_likes` (UK `(comment_id, user_id)` + catch `PersistenceException`).

        Le `comment.likeCount` est incrémenté **atomiquement** dans la même transaction.

        **Rate-limit** : `@PerUserRateLimit(name="comments.like", max=30, windowSeconds=60)`.

        **Visibilité commentaire** : héritée d'`EventService.getById` via le parent event
        — commentaire d'un event invisible → 404 anti-oracle.
      operationId: postCommentLike
      x-owner-service: engagement-service
      tags: [comments]
      security:
        - BearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '201':
          description: Nouveau like posé. `likeCount` est la valeur post-incrément.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentLikeResponse'
        '200':
          description: Like déjà présent (idempotent). `likeCount` est la valeur courante (inchangée).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentLikeResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Commentaire inexistant OU event parent invisible (anti-oracle)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      summary: Retirer un like sur un commentaire (SCRUM-144, idempotent)
      description: |
        Retire le like du caller sur le commentaire. **Idempotent** : un DELETE sans
        like préalable retourne 204 sans erreur (no-op). Le `comment.likeCount` est
        décrémenté atomiquement uniquement si une row `comment_likes` a effectivement
        été supprimée.

        Pas de rate-limit (DELETE idempotent, faible coût, pas d'incentive de spam).
      operationId: deleteCommentLike
      x-owner-service: engagement-service
      tags: [comments]
      security:
        - BearerAuth: []
      parameters:
        - name: commentId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Like supprimé OU no-op (idempotent)
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Commentaire inexistant OU event parent invisible (anti-oracle)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /comments/{commentId}/report:
    post:
      summary: Signaler un commentaire (SCRUM-144)
      description: |
        Crée un signalement sur le commentaire pour modération admin. Le report est posé
        avec `commentId` renseigné et `eventId=null` (cf. CHECK XOR sur la table `reports`,
        Décision M). Visibilité validée via l'endpoint interne
        `GET /comments/{id}/_internal-visibility` (engagement-service) — propage 404
        anti-oracle ISSUE-92 si l'event parent est invisible.

        **Rate-limit** : `@PerUserRateLimit(name="reports.commentCreate", max=5, windowSeconds=60)`.

        **Codes d'erreur applicatifs** :
        - `409 already_reported` : UK partiel `uq_report_comment_partial (reporter_id, comment_id)`
          violé (caller a déjà signalé ce commentaire).
