                  type: string
                  format: binary
      responses:
        '200':
          description: Bannière uploadée — retourne l'événement mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Event'
        '400':
          description: Fichier invalide (type MIME non supporté)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Rôle insuffisant ou pas le créateur de l'événement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /events/{id}/attend:
    post:
      summary: S'inscrire à un événement (upsert)
      description: |
        Crée ou met à jour la participation de l'utilisateur connecté à l'événement.
        **Upsert** : si une inscription existe déjà, elle est conservée (idempotent). Seul le statut ATTENDING est accepté.
        Retourne 409 si l'événement a atteint sa capacité maximale et que le statut demandé est ATTENDING.
      operationId: attendEvent
      tags: [events, attendance]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
      responses:
        '200':
          description: Inscription créée ou mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
        '400':
          description: Body absent ou invalide (status manquant ou null) / événement non publié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement introuvable ou profil utilisateur non provisionné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Capacité maximale atteinte (uniquement si status=ATTENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

    delete:
      summary: Se désinscrire d'un événement
      operationId: removeAttendance
      tags: [events, attendance]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Désinscription effectuée
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Inscription introuvable (l'utilisateur n'était pas inscrit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

