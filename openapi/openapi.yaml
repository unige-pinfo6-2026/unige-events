  /events/{id}/attend:
    post:
      summary: S'inscrire à un événement
      description: |
        Inscrit l'utilisateur connecté à l'événement. Seul le statut `ATTENDING` est
        accepté en entrée. L'appel est **idempotent** : si l'utilisateur est déjà
        inscrit (`ATTENDING` ou `WAITLISTED`), l'inscription existante est renvoyée
        telle quelle, sans modification.

        Si l'événement a une `capacity` définie et qu'elle est atteinte, la nouvelle
        inscription est automatiquement placée en `WAITLISTED` (200) — ce n'est pas
        une erreur. Le client inspecte `status` dans la réponse pour savoir s'il est
        en file d'attente. Lorsqu'un slot se libère (désinscription d'un `ATTENDING`),
        le premier `WAITLISTED` (ordre `createdAt` ASC) est promu automatiquement.

        Retourne 409 `registration_closed` si `registrationDeadline` est dépassée.
      operationId: attendEvent
      x-owner-service: engagement-service
      tags: [events, attendance]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
      responses:
        '200':
          description: |
            Inscription créée (ou inscription existante renvoyée si déjà inscrit).
            Le champ `status` peut valoir `ATTENDING` ou `WAITLISTED` — ce dernier
            est assigné par le serveur quand la capacité est atteinte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
        '400':
          description: |
            Body absent ou invalide, statut différent de `ATTENDING`, ou événement
            non publié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement introuvable ou profil utilisateur non provisionné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: |
            Conflit métier. Codes possibles dans `error` :
            - `registration_closed` : la `registrationDeadline` est dépassée.
            La capacité atteinte ne renvoie plus 409 — l'utilisateur est placé en
            `WAITLISTED` (200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

    delete:
      summary: Se désinscrire d'un événement
      operationId: removeAttendance
      x-owner-service: engagement-service
      tags: [events, attendance]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Désinscription effectuée
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Inscription introuvable (l'utilisateur n'était pas inscrit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /events/{id}/attendees:
    get:
      summary: Liste des participants à un événement (filtre confidentialité au niveau DTO)
      description: |
        Retourne la liste paginée des inscriptions à l'événement, avec un **filtre de
        confidentialité appliqué côté backend au niveau DTO** :

        - **Vue organisateur** — créateur, co-organisateur ACCEPTED (cf. SCRUM-136 cascade
          `isCreatorOrAcceptedCoOrganizer`), ou administrateur : reçoit l'identité réelle
          (`displayName`, `avatarUrl`, `userId`) pour **toutes** les lignes, y compris les
          profils privés (`profilePublic=false`).
        - **Autre utilisateur authentifié** : reçoit l'identité réelle uniquement pour les
          profils publics (`profilePublic=true`). Les lignes correspondant à un profil
          privé sont **anonymisées** côté backend : `displayName=null`, `avatarUrl=null`,
          `userId=null`. L'UUID est volontairement masqué afin que l'appelant ne puisse
          pas sonder `GET /users/{id}` pour désanonymiser le participant.
        - **Utilisateur supprimé** (référence orpheline) : anonymisé de la même façon
          quel que soit le rôle de l'appelant — il n'y a aucune identité réelle à exposer.

        L'endpoint requiert d'être authentifié ; il ne renvoie plus 403 aux non-organisateurs
        (la confidentialité est garantie par la projection ci-dessus, pas par un gate
        d'accès).
      operationId: getEventAttendees
      x-owner-service: engagement-service
      tags: [events, attendance]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: |
            Liste paginée des inscriptions. Pour un appelant non-organisateur, les lignes
            correspondant à un profil privé sont anonymisées (`displayName`, `avatarUrl`,
            `userId` tous nuls).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attendance'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /events/{id}/co-organizers:
    post:
      summary: Inviter un utilisateur comme co-organisateur
      description: |
        Crée une invitation `PENDING`. Réservé au créateur de l'événement ou à un admin.
        L'utilisateur invité doit déjà être provisionné en base.

        Codes d'erreur :
        - `400 cannot_invite_self` : tentative d'auto-invitation par le créateur.
        - `403 forbidden` : appelant non créateur et non admin.
        - `404 not_found` : événement introuvable, ou `userId` cible introuvable.
        - `409 already_invited` : l'utilisateur a déjà une invitation PENDING ou ACCEPTED sur cet event.
      operationId: inviteCoOrganizer
      x-owner-service: event-service
      tags: [events, co-organizers]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCoOrganizerRequest'
      responses:
        '201':
          description: Invitation créée (status PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoOrganizer'
        '400':
          description: |
            Body absent ou body sans `userId` → `ValidationErrorResponse` (validation
            Hibernate Validator). `error=cannot_invite_self` si le créateur tente de
            s'inviter lui-même.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Appelant non créateur de l'événement et non admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement ou utilisateur cible introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Une invitation PENDING ou ACCEPTED existe déjà pour ce couple (event, user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

    get:
      summary: Lister les co-organisateurs d'un événement
      description: |
        Retourne la liste de tous les co-organisateurs (PENDING + ACCEPTED) d'un événement,
        triée par `invitedAt` ASC. Authentifié uniquement.
        Les rows DECLINED sont supprimées physiquement (cf. `PATCH /me/decline`) — elles
        n'apparaissent donc jamais ici.
      operationId: listCoOrganizers
      x-owner-service: event-service
      tags: [events, co-organizers]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Liste des co-organisateurs (tableau vide si aucun — jamais 404)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoOrganizer'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /events/{id}/co-organizers/{userId}:
    delete:
      summary: Retirer un co-organisateur
      description: |
        Supprime physiquement la row `EventCoOrganizer`. Réservé au créateur ou à un admin.
        Idempotent côté résultat : retourne 204 même si l'utilisateur n'avait pas d'invitation
        (mais retourne 404 si l'événement lui-même n'existe pas — pour éviter de masquer un
