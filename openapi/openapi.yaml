            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Rôle ADMIN requis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /events/{id}/attend:
    post:
      summary: S'inscrire à un événement
      description: |
        Inscrit l'utilisateur connecté à l'événement. Seul le statut `ATTENDING` est
        accepté en entrée. L'appel est **idempotent** : si l'utilisateur est déjà
        inscrit (`ATTENDING` ou `WAITLISTED`), l'inscription existante est renvoyée
        telle quelle, sans modification.

        Si l'événement a une `capacity` définie et qu'elle est atteinte, la nouvelle
        inscription est automatiquement placée en `WAITLISTED` (200) — ce n'est pas
        une erreur. Le client inspecte `status` dans la réponse pour savoir s'il est
        en file d'attente. Lorsqu'un slot se libère (désinscription d'un `ATTENDING`),
        le premier `WAITLISTED` (ordre `createdAt` ASC) est promu automatiquement.

        Retourne 409 `registration_closed` si `registrationDeadline` est dépassée.
      operationId: attendEvent
      tags: [events, attendance]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceRequest'
      responses:
        '200':
          description: |
            Inscription créée (ou inscription existante renvoyée si déjà inscrit).
            Le champ `status` peut valoir `ATTENDING` ou `WAITLISTED` — ce dernier
            est assigné par le serveur quand la capacité est atteinte.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attendance'
        '400':
          description: |
            Body absent ou invalide, statut différent de `ATTENDING`, ou événement
            non publié.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement introuvable ou profil utilisateur non provisionné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: |
            Conflit métier. Codes possibles dans `error` :
            - `registration_closed` : la `registrationDeadline` est dépassée.
            La capacité atteinte ne renvoie plus 409 — l'utilisateur est placé en
            `WAITLISTED` (200).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

    delete:
      summary: Se désinscrire d'un événement
      operationId: removeAttendance
      tags: [events, attendance]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Désinscription effectuée
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Inscription introuvable (l'utilisateur n'était pas inscrit)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /events/{id}/attendees:
    get:
      summary: Liste des participants à un événement (créateur ou co-organisateur ACCEPTED)
      description: |
        Retourne la liste paginée des inscriptions à l'événement.
        Réservé au créateur de l'événement **ou à un co-organisateur ACCEPTED** (cf. SCRUM-136
        cascade `isCreatorOrAcceptedCoOrganizer`) — retourne 403 pour tout autre utilisateur authentifié.
      operationId: getEventAttendees
      tags: [events, attendance]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Liste paginée des inscriptions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Attendance'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Appelant ni créateur ni co-organisateur ACCEPTED (cf. SCRUM-136 cascade)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /events/{id}/co-organizers:
    post:
      summary: Inviter un utilisateur comme co-organisateur
      description: |
        Crée une invitation `PENDING`. Réservé au créateur de l'événement ou à un admin.
        L'utilisateur invité doit déjà être provisionné en base.

        Codes d'erreur :
        - `400 cannot_invite_self` : tentative d'auto-invitation par le créateur.
        - `403 forbidden` : appelant non créateur et non admin.
        - `404 not_found` : événement introuvable, ou `userId` cible introuvable.
        - `409 already_invited` : l'utilisateur a déjà une invitation PENDING ou ACCEPTED sur cet event.
      operationId: inviteCoOrganizer
      tags: [events, co-organizers]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteCoOrganizerRequest'
      responses:
        '201':
          description: Invitation créée (status PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoOrganizer'
        '400':
          description: |
            Body absent ou body sans `userId` → `ValidationErrorResponse` (validation
            Hibernate Validator). `error=cannot_invite_self` si le créateur tente de
            s'inviter lui-même.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Appelant non créateur de l'événement et non admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement ou utilisateur cible introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Une invitation PENDING ou ACCEPTED existe déjà pour ce couple (event, user)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

    get:
      summary: Lister les co-organisateurs d'un événement
      description: |
        Retourne la liste de tous les co-organisateurs (PENDING + ACCEPTED) d'un événement,
        triée par `invitedAt` ASC. Authentifié uniquement.
        Les rows DECLINED sont supprimées physiquement (cf. `PATCH /me/decline`) — elles
        n'apparaissent donc jamais ici.
      operationId: listCoOrganizers
      tags: [events, co-organizers]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Liste des co-organisateurs (tableau vide si aucun — jamais 404)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoOrganizer'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /events/{id}/co-organizers/{userId}:
    delete:
      summary: Retirer un co-organisateur
      description: |
        Supprime physiquement la row `EventCoOrganizer`. Réservé au créateur ou à un admin.
        Idempotent côté résultat : retourne 204 même si l'utilisateur n'avait pas d'invitation
        (mais retourne 404 si l'événement lui-même n'existe pas — pour éviter de masquer un
        ID erroné côté client).
      operationId: removeCoOrganizer
      tags: [events, co-organizers]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Co-organisateur retiré (ou n'avait pas d'invitation — idempotent)
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Appelant non créateur et non admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /events/{id}/co-organizers/me/accept:
    patch:
      summary: Accepter une invitation à co-organiser
      description: |
        Bascule le status `PENDING` → `ACCEPTED`. L'utilisateur authentifié doit avoir une
        invitation PENDING sur cet événement. À partir de là, il peut éditer / publier /
        annuler / restaurer / charger une bannière / consulter les inscrits / les stats.

        Si l'invitation est déjà ACCEPTED → 200 idempotent (renvoie l'état actuel sans
        modification).
        Si aucune invitation → 404.
      operationId: acceptCoOrganizerInvitation
      tags: [events, co-organizers]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Invitation acceptée (ou déjà ACCEPTED — idempotent)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoOrganizer'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: |
            `error=no_pending_invitation` — aucune invitation pour l'utilisateur courant
            sur cet événement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /events/{id}/co-organizers/me/decline:
    patch:
      summary: Décliner une invitation à co-organiser
      description: |
        Supprime physiquement la row `EventCoOrganizer` correspondant à l'utilisateur courant
        (cf. décision 5 de la spec : DECLINE = DELETE row, autorise une ré-invitation
        ultérieure sans 409). Si aucune invitation → 404.
      operationId: declineCoOrganizerInvitation
      tags: [events, co-organizers]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Invitation déclinée (row supprimée)
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: |
            `error=no_pending_invitation` — aucune invitation pour l'utilisateur courant
            sur cet événement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /users/me/co-organizer-invitations:
    get:
      summary: Mes invitations à co-organiser
      description: |
        Retourne les invitations adressées à l'utilisateur courant. Par défaut `status=PENDING`.
        Chaque entrée enrichit l'événement complet (`Event` schema) pour que le frontend puisse
        afficher titre / dates / banner sans refetch.

        Les invitations sur des événements `CANCELLED` apparaissent normalement (l'invité a le
        droit de comprendre pourquoi son badge a clignoté).
      operationId: getMyCoOrganizerInvitations
      tags: [users, co-organizers]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filtre optionnel sur un statut. Par défaut `PENDING`.
          schema:
            $ref: '#/components/schemas/CoOrganizerStatus'
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Liste paginée des invitations (tableau vide si aucune)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CoOrganizerInvitation'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Profil utilisateur introuvable (non provisionné — appeler GET /users/me d'abord)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /events/{id}/favorite:
