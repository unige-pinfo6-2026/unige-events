  /admin/reports:
    get:
      summary: Liste paginée des signalements (admin uniquement)
      description: |
        Retourne la liste des signalements, triée par `createdAt DESC` (tie-breaker
        `id DESC`). Filtre par `status` (défaut `PENDING`). Pagination identique à
        `/users/me/favorites`. Réservé au rôle ADMIN
        (`@RolesAllowed("ADMIN")` Quarkus Security).
      operationId: listReports
      tags: [admin, reports]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReportStatus'
          description: Filtre sur le statut. Défaut `PENDING`.
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Liste paginée des signalements (tableau vide si aucun)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Report'
        '400':
          description: |
            Query params invalides — `page < 0` ou `size` hors de l'intervalle [1, 100]
            (Bean Validation `@Min(0)` / `@Positive` / `@Max(100)`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Appelant authentifié mais sans rôle ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /admin/reports/{id}:
    patch:
      summary: Traiter un signalement (admin uniquement)
      description: |
        Transitionne un signalement de `PENDING` vers `REVIEWED` ou `DISMISSED`. Pose
        `reviewedAt = now()` et `reviewedBy = caller.id`. Optionnellement persiste une
        `moderationNote`.

        **SCRUM-97 — effet de cascade lorsque `status=REVIEWED`** :
        - L'événement lié passe en `EventStatus.BANNED` (état terminal côté
          créateur — pas de republish ni de modification possibles).
        - Tous les autres signalements en statut `PENDING` sur le même événement
          sont automatiquement clôturés en `REVIEWED` avec `reviewedBy = admin
          courant` et `reviewedAt = now()`. Leur `moderationNote` reste `null`
          (seul le signalement explicitement traité porte la note de l'admin).

        `status=DISMISSED` est neutre : le signalement est fermé, mais l'événement
        et les signalements frères ne sont pas touchés.

        Codes d'erreur :
        - `400 invalid_status` : `status` du body n'est ni REVIEWED ni DISMISSED.
        - `404 not_found` : signalement introuvable, ou profil admin non provisionné.
        - `409 invalid_transition` : le signalement n'est plus en statut PENDING (déjà
          traité).
      operationId: handleReport
      tags: [admin, reports]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandleReportRequest'
      responses:
        '200':
          description: Signalement traité
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          description: Body invalide (ex. `status=PENDING` ou statut inconnu)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Appelant authentifié mais sans rôle ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Signalement introuvable, ou profil admin non provisionné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Le signalement n'est plus en statut PENDING (déjà traité)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

