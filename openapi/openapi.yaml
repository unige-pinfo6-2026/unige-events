  /users/me/participations:
    get:
      summary: Mes événements (côté participant)
      description: |
        Retourne les événements auxquels l'utilisateur connecté est inscrit, enrichis
        comme les autres listes (counts, availableSpots) pour permettre au frontend de
        rendre des EventCards sans N+1.

        Filtres optionnels :
        - `status` : statut de l'inscription (`ATTENDING` ou `WAITLISTED`).
        - `timeframe` : position temporelle de l'événement par rapport à `now()`.
          `upcoming` retourne les événements dont `endDate >= now` (un événement en
          cours est `upcoming`), `past` retourne les événements dont `endDate < now`.
          Comparaison **insensible à la casse** (`upcoming`, `UPCOMING`, `Upcoming`).

        Sans filtre, retourne toutes les inscriptions du caller, tous statuts et
        toutes périodes confondus.
      operationId: getMyParticipationEvents
      x-owner-service: engagement-service
      tags: [users, attendance, events]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filtre optionnel sur le statut de l'inscription. Omettre pour récupérer toutes les inscriptions.
          schema:
            $ref: '#/components/schemas/AttendanceStatus'
        - name: timeframe
          in: query
          description: |
            Filtre optionnel sur la période. `upcoming` = événements en cours ou à
            venir (`endDate >= now`). `past` = événements terminés (`endDate < now`).
            Insensible à la casse. Omettre pour ne pas filtrer.
          schema:
            type: string
            enum: [upcoming, past]
      responses:
        '200':
          description: Liste des événements (tableau vide si aucun — jamais 404)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '400':
          description: Valeur de `timeframe` invalide (n'est ni `upcoming` ni `past`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Profil utilisateur introuvable (appeler GET /users/me d'abord)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /users/{id}/participations:
    get:
      summary: Participations publiques d'un utilisateur
      description: |
        Retourne les événements **PUBLISHED** auxquels l'utilisateur cible est
        **inscrit (ATTENDING)**, enrichis comme les autres listes (counts,
        availableSpots) pour rendre des EventCards sans N+1. Consommé par la
        section « Participations publiques » du profil public (SCRUM-141 suite).

        **Visibilité (gating)** — aligné sur la révision SCRUM-169 de
        `GET /users/{id}` (qui a abandonné le 404 anti-oracle) :
        - caller = cible (self) → liste de ses participations, quel que soit `profilePublic`.
        - caller ≠ cible, cible `profilePublic = true` → liste.
        - caller ≠ cible, cible `profilePublic = false` → **`[]`** (pas de leak, pas d'oracle).
        - UUID inexistant → `[]`.

        Seules les inscriptions `ATTENDING` à des événements `PUBLISHED` sont
        exposées (jamais `WAITLISTED`, jamais `DRAFT`/`CANCELLED` d'un tiers).
      operationId: getUserParticipations
      x-owner-service: engagement-service
      tags: [users, attendance, events]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: timeframe
          in: query
          description: |
            Filtre optionnel sur la période. `upcoming` = événements en cours ou à
            venir (`endDate >= now`). `past` = événements terminés (`endDate < now`).
            Insensible à la casse. Omettre pour ne pas filtrer.
          schema:
            type: string
            enum: [upcoming, past]
      responses:
        '200':
          description: |
            Liste des événements (tableau vide si aucun, si la cible est privée
            pour un appelant tiers, ou si l'UUID est inconnu — jamais 404).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '400':
          description: Valeur de `timeframe` invalide (n'est ni `upcoming` ni `past`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Token absent ou invalide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /users/me/events:
    get:
      summary: Mes événements créés (tous statuts)
      description: |
        Retourne tous les événements où l'utilisateur connecté est le créateur, triés par `createdAt DESC`.
        Inclut **tous les statuts** (DRAFT, PUBLISHED, CANCELLED) par défaut. Utiliser le paramètre `status`
        pour filtrer sur un statut précis.

        **Règle d'autorisation** : l'identité provient du JWT. Il est impossible d'énumérer les événements
        d'un autre utilisateur via cet endpoint, ce qui permet de retourner DRAFT et CANCELLED sans
        vérification supplémentaire. Pour lister publiquement les événements publiés d'un organisateur,
        utiliser `GET /events?organizerId=<uuid>` (qui force `status=PUBLISHED`).
      operationId: getMyEvents
      x-owner-service: event-service
      tags: [users, events]
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filtre optionnel sur un statut. Omettre pour récupérer tous les statuts.
          schema:
            $ref: '#/components/schemas/EventStatus'
        - name: page
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: Liste des événements créés par l'utilisateur (tableau vide si aucun — jamais 404)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Profil utilisateur introuvable (appeler GET /users/me d'abord)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /calendar/{calendarToken}.ics:
    get:
      summary: Flux iCalendar personnel (webcal)
      description: |
        Retourne le flux iCalendar RFC 5545 des événements PUBLISHED que l'utilisateur
        (identifié par son token personnel) a mis en favori ou auxquels il est inscrit (ATTENDING).
        Union des deux sources, dédupliquée. Polled automatiquement par les applications calendrier.
        Content-Type: text/calendar;charset=UTF-8.
        Authentification via token dans l'URL (pas de Bearer JWT requis).
      operationId: getCalendarFeed
      x-owner-service: user-service
      tags: [calendar]
      security: []
      parameters:
        - name: calendarToken
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Token personnel opaque de l'utilisateur
      responses:
        '200':
          description: Flux iCalendar valide (RFC 5545)
          content:
            text/calendar:
              schema:
                type: string
                example: "BEGIN:VCALENDAR\r\nVERSION:2.0\r\n...\r\nEND:VCALENDAR"
        '404':
          description: Token inconnu ou révoqué
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /events:
    get:
