  /events/{id}/report:
    post:
      summary: Signaler un événement
      description: |
        Crée un signalement sur un événement PUBLISHED. Réservé aux utilisateurs
        authentifiés non-créateurs et non-co-organisateurs ACCEPTED de l'événement.

        Codes d'erreur :
        - `400 cannot_report_draft` : l'événement est en statut DRAFT (non public).
        - `400 cannot_report_cancelled` : l'événement est en statut CANCELLED.
        - `400 cannot_report_banned` : l'événement a déjà été retiré par modération
          (`EventStatus.BANNED`, SCRUM-97). Pas la peine de re-signaler.
        - `404 not_found` : événement introuvable, ou profil utilisateur non provisionné.
        - `409 already_reported` : l'utilisateur a déjà signalé cet événement (unique
          constraint sur `(reporter_id, event_id)`).
        - `422 cannot_report_own_event` : tentative de signalement de son propre event
          (créateur ou co-organisateur ACCEPTED, cf. cascade SCRUM-136).
      operationId: reportEvent
      tags: [events, reports]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReportRequest'
      responses:
        '201':
          description: Signalement créé (status PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          description: Body invalide, ou `cannot_report_draft`, ou `cannot_report_cancelled`, ou `cannot_report_banned`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Événement introuvable, ou profil utilisateur non provisionné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Cet utilisateur a déjà signalé cet événement
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '422':
          description: |
            `cannot_report_own_event` — l'utilisateur est créateur ou co-organisateur
            ACCEPTED de l'événement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

