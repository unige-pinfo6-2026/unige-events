  /admin/reports/{id}:
    patch:
      summary: Traiter un signalement (admin uniquement)
      description: |
        Transitionne un signalement de `PENDING` vers `REVIEWED` ou `DISMISSED`. Pose
        `reviewedAt = now()` et `reviewedBy = caller.id`. Optionnellement persiste une
        `moderationNote`.

        **SCRUM-97 — effet de cascade lorsque `status=REVIEWED`** :
        - L'événement lié passe en `EventStatus.BANNED` (état terminal côté
          créateur — pas de republish ni de modification possibles).
        - Tous les autres signalements en statut `PENDING` sur le même événement
          sont automatiquement clôturés en `REVIEWED` avec `reviewedBy = admin
          courant` et `reviewedAt = now()`. Leur `moderationNote` reste `null`
          (seul le signalement explicitement traité porte la note de l'admin).

        `status=DISMISSED` est neutre : le signalement est fermé, mais l'événement
        et les signalements frères ne sont pas touchés.

        Codes d'erreur :
        - `400 invalid_status` : `status` du body n'est ni REVIEWED ni DISMISSED.
        - `404 not_found` : signalement introuvable, ou profil admin non provisionné.
        - `409 invalid_transition` : le signalement n'est plus en statut PENDING (déjà
          traité).
      operationId: handleReport
      x-owner-service: moderation-service
      tags: [admin, reports]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandleReportRequest'
      responses:
        '200':
          description: Signalement traité
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '400':
          description: Body invalide (ex. `status=PENDING` ou statut inconnu)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '403':
          description: Appelant authentifié mais sans rôle ADMIN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Signalement introuvable, ou profil admin non provisionné
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '409':
          description: Le signalement n'est plus en statut PENDING (déjà traité)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /users/me/notifications:
    get:
      summary: Liste des notifications de l'utilisateur connecté (non lues en premier)
      description: |
        Retourne les notifications du caller, triées **unread first puis `createdAt DESC,
        id DESC`** (SCRUM-99). Paginées via `?page=0&size=20`. Le header de réponse
        `X-Unread-Count` porte le nombre total de notifs non lues du caller (inconditionnel,
        même `0`), ce qui évite un round-trip dédié pour le badge UI.
      operationId: getMyNotifications
      x-owner-service: notification-service
      tags: [notifications]
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Liste paginée des notifications
          headers:
            X-Unread-Count:
              description: Nombre total de notifications `read=false` du caller (toutes pages confondues).
              schema:
                type: integer
                format: int64
                minimum: 0
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
        '401':
          description: Token absent, invalide, ou profil non provisionné côté user-service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'

  /users/me/notifications/{id}/read:
    patch:
      summary: Marquer une notification comme lue
      description: |
        Idempotent — une notif déjà `read=true` renvoie `204` sans modification.
        Anti-oracle : une notification appartenant à un autre user retourne `404`
        (même envelope qu'un id inexistant).
      operationId: markMyNotificationRead
      x-owner-service: notification-service
      tags: [notifications]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Notification marquée comme lue (idempotent).
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '404':
          description: Notification introuvable, ou appartenant à un autre user (anti-oracle)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /users/me/notifications/read-all:
    patch:
      summary: Marquer toutes les notifications du caller comme lues
      description: |
        Opération bulk. Retourne le nombre de rows passées de `read=false` à `read=true`.
        Idempotent — appel répété sur un fil déjà entièrement lu retourne `{ "updated": 0 }`.
      operationId: markAllMyNotificationsRead
      x-owner-service: notification-service
      tags: [notifications]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Notifications marquées comme lues (bulk update)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadAllResponse'
        '401':
          description: Token absent ou invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'

  /s/{shortCode}:
    get:
      summary: Redirection courte vers la page d'un événement
      description: |
        Redirige (302) vers la page frontend de l'événement correspondant au shortCode.
        Endpoint public — aucun token requis (conçu pour être partagé par lien).
      operationId: redirectByShortCode
      x-owner-service: event-service
      tags: [events]
      security: []
      parameters:
        - name: shortCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '302':
          description: Redirection vers la page de l'événement
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: URL frontend de l'événement (ex. https://10.25.10.136.nip.io/events/42)
        '404':
          description: shortCode inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiErrorResponse'
