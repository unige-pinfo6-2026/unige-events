name: ${DOCKER_PREFIX}

services:
  db:
    image: postgres:16
    restart: always
    env_file:
      - .env
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ${POSTGRES_DIR}:/var/lib/postgresql/data/

  backend:
    build: ./backend
    env_file:
      - backend/.env
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      DB_HOST: db
      DB_PORT: ${POSTGRES_PORT}
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      - db

  frontend:
    build: ./frontend
    env_file:
      - frontend/.env
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - backend

volumes:
  postgres_data: