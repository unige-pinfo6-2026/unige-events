name: ${DOCKER_PREFIX}

services:
  db:
    image: postgres:16
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - ${DB_DIR}:/var/lib/postgresql/data/

  api:
    build: .
    env_file:
      - .env
    ports:
      - "${API_PORT}:8080"
    depends_on:
      - db

volumes:
  postgres_data: