apiVersion: v1
kind: ConfigMap
metadata:
  name: kong-config
  namespace: {{ .Release.Namespace }}
data:
  kong.yml: |
    _format_version: "3.0"

    services:
      - name: event-service
        url: http://event-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: event-counters
            # Consolidates the three idempotent counter / share endpoints
            # served by event-service: share-url lookup, view tracking,
            # creator stats. All route to the same upstream.
            paths:
              - ~/api/events/(?:\d+)/(?:share|view|stats)$
            strip_path: false
            preserve_host: true
          - name: shortlink
            paths:
              - ~/api/s/[^/]+$
            strip_path: false
            preserve_host: true
          - name: favorite-actions
            paths:
              - ~/api/events/(?:\d+)/favorite$
            strip_path: false
            preserve_host: true
          - name: my-favorites
            paths:
              - ~/api/users/me/favorites$
            strip_path: false
            preserve_host: true
          - name: co-organizer-me
            paths:
              - ~/api/events/(?:\d+)/co-organizers/me/(?:accept|decline)$
            strip_path: false
            preserve_host: true
          - name: co-organizer-userid
            paths:
              - ~/api/events/(?:\d+)/co-organizers/[^/]+$
            strip_path: false
            preserve_host: true
          - name: co-organizers
            paths:
              - ~/api/events/(?:\d+)/co-organizers$
            strip_path: false
            preserve_host: true
          - name: my-co-org-invites
            paths:
              - ~/api/users/me/co-organizer-invitations$
            strip_path: false
            preserve_host: true
          - name: my-events
            paths:
              - ~/api/users/me/events$
            strip_path: false
            preserve_host: true
          - name: events-search
            paths:
              - ~/api/events/search$
            strip_path: false
            preserve_host: true
          - name: events-featured
            paths:
              - ~/api/events/featured$
            strip_path: false
            preserve_host: true
          - name: admin-event-feature
            paths:
              - ~/api/admin/events/(?:\d+)/(?:un)?feature$
            strip_path: false
            preserve_host: true
          - name: events-occurrences
            paths:
              - ~/api/events/(?:\d+)/occurrences$
            strip_path: false
            preserve_host: true
          - name: events-state-transitions
            # Consolidates the four lifecycle transition endpoints on an
            # event: cancel (PUBLISHED → CANCELLED), restore (CANCELLED →
            # DRAFT), publish (DRAFT → PUBLISHED), duplicate (clone to a
            # new DRAFT). All route to the same upstream.
            paths:
              - ~/api/events/(?:\d+)/(?:cancel|restore|publish|duplicate)$
            strip_path: false
            preserve_host: true
          - name: events-image
            paths:
              - ~/api/events/(?:\d+)/image$
            strip_path: false
            preserve_host: true
          - name: events-attachments
            # SCRUM-148 — POST /api/events/{id}/attachments and
            # DELETE /api/events/{id}/attachments/{aid}. Single regex covers
            # all sub-paths. Must be declared BEFORE events-by-id so the
            # /attachments suffix is not swallowed by the catch-all id route.
            # SCRUM-149 — added optional /download suffix on the {aid} branch
            # for the public force-download endpoint
            # (GET /api/events/{id}/attachments/{aid}/download).
            paths:
              - ~/api/events/(?:\d+)/attachments(?:/(?:\d+)(?:/download)?)?$
            strip_path: false
            preserve_host: true
          - name: events-by-id
            paths:
              - ~/api/events/(?:\d+)$
            strip_path: false
            preserve_host: true
          # /api/events split by method so the rate limit applies to CREATE only.
          # Previously a single all-methods route throttled the public GET listing
          # to 10/min per IP (unusable behind shared NAT) — see load-testing/RESULTS.md.
          - name: events-create
            paths:
              - ~/api/events$
            methods:
              - POST
            strip_path: false
            preserve_host: true
            plugins:
              - name: rate-limiting
                config:
                  minute: 10
                  policy: local
                  fault_tolerant: true
                  hide_client_headers: false
          - name: events-list
            paths:
              - ~/api/events$
            methods:
              - GET
              - HEAD
              - OPTIONS
            strip_path: false
            preserve_host: true
      - name: user-service
        url: http://user-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: user-image
            paths:
              - ~/api/users/me/image$
            strip_path: false
            preserve_host: true
          - name: user-banner
            paths:
              - ~/api/users/me/banner$
            strip_path: false
            preserve_host: true
          - name: update-username
            paths:
              - ~/api/users/me/username$
            strip_path: false
            preserve_host: true
          - name: get-by-username
            paths:
              - ~/api/users/by-username/[^/]+$
            strip_path: false
            preserve_host: true
          - name: users-search
            # Must come BEFORE user-by-id ($users/[^/]+) — otherwise the catch-all
            # would swallow this path. Application-level rate-limit handles
            # burst control (60 req/min/user via @PerUserRateLimit).
            paths:
              - ~/api/users/search$
            strip_path: false
            preserve_host: true
          - name: user-by-id
            paths:
              - ~/api/users/[^/]+$
            strip_path: false
            preserve_host: true
          - name: follow-actions
            paths:
              - ~/api/users/[^/]+/follow$
            strip_path: false
            preserve_host: true
            plugins:
              - name: rate-limiting
                config:
                  minute: 30
                  policy: local
                  fault_tolerant: true
                  hide_client_headers: false
          - name: follow-listings
            paths:
              - ~/api/users/[^/]+/(?:followers|following)$
            strip_path: false
            preserve_host: true
          - name: follow-requests
            paths:
              - ~/api/follow-requests/(?:\d+)/(?:accept|reject)$
            strip_path: false
            preserve_host: true
          - name: my-follow-reqs
            paths:
              - ~/api/users/me/follow-requests$
            strip_path: false
            preserve_host: true
          - name: calendar-token-actions
            # Consolidates calendar-token lookup (GET) and rotation
            # (POST /regenerate). Both served by user-service.
            paths:
              - ~/api/users/me/calendar-token(?:/regenerate)?$
            strip_path: false
            preserve_host: true
          - name: ics-feed
            paths:
              - ~/api/calendar/[^/]+\.ics$
            strip_path: false
            preserve_host: true
      - name: moderation-service
        url: http://moderation-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: report-event
            paths:
              - ~/api/events/(?:\d+)/report$
            strip_path: false
            preserve_host: true
          - name: report-comment
            # SCRUM-144 Décision N — POST /api/comments/{id}/report routes to
            # moderation-service (not engagement-service which owns
            # /api/comments/{id} and /like). Declared in the moderation-service
            # block so the upstream selection is unambiguous.
            paths:
              - ~/api/comments/(?:\d+)/report$
            strip_path: false
            preserve_host: true
          - name: admin-reports-all
            # Consolidates list (GET /admin/reports) and per-id update
            # (PATCH /admin/reports/{id}). Both admin-only, same upstream.
            paths:
              - ~/api/admin/reports(?:/(?:\d+))?$
            strip_path: false
            preserve_host: true
      - name: engagement-service
        url: http://engagement-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: attend-actions
            paths:
              - ~/api/events/(?:\d+)/attend$
            strip_path: false
            preserve_host: true
          - name: event-attendees
            paths:
              - ~/api/events/(?:\d+)/attendees$
            strip_path: false
            preserve_host: true
          - name: my-attendances
            paths:
              - ~/api/users/me/attendances$
            strip_path: false
            preserve_host: true
          - name: my-participations
            paths:
              - ~/api/users/me/participations$
            strip_path: false
            preserve_host: true
          - name: user-participations
            # SCRUM-141 suite — GET /api/users/{id}/participations (participations
            # publiques d'un user cible). [^/]+ couvre l'UUID (et "me", même upstream
            # engagement-service). Ne conflicte pas avec user-by-id (~/api/users/[^/]+$,
            # un seul segment) qui vit côté user-service.
            paths:
              - ~/api/users/[^/]+/participations$
            strip_path: false
            preserve_host: true
          - name: event-comments
            paths:
              - ~/api/events/(?:\d+)/comments$
            strip_path: false
            preserve_host: true
            plugins:
              - name: rate-limiting
                config:
                  minute: 10
                  policy: local
                  fault_tolerant: true
                  hide_client_headers: false
          - name: comment-like
            # SCRUM-144 — POST/DELETE /api/comments/{id}/like (engagement-service
            # owns comment_likes). Declared BEFORE comment-direct so the /like
            # suffix is not swallowed by the catch-all id route.
            paths:
              - ~/api/comments/(?:\d+)/like$
            strip_path: false
            preserve_host: true
          - name: comment-direct
            paths:
              - ~/api/comments/(?:\d+)$
            strip_path: false
            preserve_host: true
      - name: notification-service
        url: http://notification-service:8080
        connect_timeout: 5000
        read_timeout: 30000
        write_timeout: 30000
        routes:
          - name: notifications-read-all
            paths:
              - ~/api/users/me/notifications/read-all$
            strip_path: false
            preserve_host: true
          - name: notification-mark-read
            paths:
              - ~/api/users/me/notifications/(?:\d+)/read$
            strip_path: false
            preserve_host: true
          - name: user-notifications
            paths:
              - ~/api/users/me/notifications/?$
            strip_path: false
            preserve_host: true
    plugins:
      - name: cors
        config:
          origins:
            - "https://pinfo6.p-info.net"
            - "https://*.pinfo6.p-info.net"
            - "https://*.trycloudflare.com"
          methods:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
            - OPTIONS
          headers:
            - Authorization
            - Content-Type
            - Accept
            - Origin
            - X-Requested-With
            - X-Request-ID
          exposed_headers:
            - X-Request-ID
            - Retry-After
          credentials: true
          max_age: 3600
      - name: correlation-id
        config:
          header_name: X-Request-ID
          generator: uuid
          echo_downstream: true
      - name: prometheus
        config:
          per_consumer: false
          status_code_metrics: true
          latency_metrics: true
          bandwidth_metrics: true
          upstream_health_metrics: true
      - name: request-transformer
        config:
          remove:
            headers:
              - X-Internal-Token
