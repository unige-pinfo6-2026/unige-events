apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: event-service
    migration-step: extracted
spec:
  # EventExpirationJob has no leader election — scaling out would double-fire Kafka events.
  {{- $eventService := default dict .Values.eventService }}
  {{- if gt (int (default 1 $eventService.replicas)) 1 }}
  {{- fail "event-service must run at replicas:1 strict — EventExpirationJob has no leader election. Cf. ADR-001." }}
  {{- end }}
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-secret
      initContainers:
        {{- include "unige-events.waitForKafka" . | nindent 8 }}
      containers:
        - name: event-service
          image: {{ .Values.image.registry }}/{{ .Values.image.org }}/unige-events-event-service:{{ .Values.image.tag | default "latest" }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: TZ
              value: "Europe/Zurich"
            - name: JAVA_TOOL_OPTIONS
              value: "-Duser.timezone=Europe/Zurich"
            - name: DB_HOST
              value: {{ if .Values.postgres.shared }}postgres{{ else }}postgres-event{{ end }}
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: unige_events_events
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
            - name: S3_ENDPOINT
              value: http://minio:9000
            # Public origin the browser uses to fetch uploaded objects, served
            # by the unige-events-s3 ingress. Distinct from S3_ENDPOINT (the
            # in-cluster S3 client target) so client-facing URLs stay reachable.
            - name: S3_URL
              value: https://{{ .Values.ingress.host }}/s3
          envFrom:
            - secretRef:
                name: app-secrets
          resources:
            {{- toYaml .Values.eventService.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /api/q/health/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/q/health/live
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
