quarkus.http.root-path=api
quarkus.http.port=${API_PORT:8080}
quarkus.http.host=0.0.0.0

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:postgres}
quarkus.datasource.password=${DB_PASSWORD:postgres}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:unige_events}
%dev.quarkus.datasource.dev-ui.allow-sql=true

# Flyway
quarkus.hibernate-orm.schema-management.strategy=update
# quarkus.flyway.migrate-at-start=true

# OIDC
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:https://your-auth-server.com/}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:your-client-id}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:your-client-secret}
quarkus.oidc.token.audience=${OIDC_AUDIENCE:https://your-api-audience}
quarkus.oidc.application-type=service

# Test
%test.quarkus.oidc.enabled=false
%test.quarkus.security.auth.enabled-in-dev-mode=false
%test.quarkus.datasource.active=false
%test.quarkus.devservices.enabled=true
%test.quarkus.hibernate-orm.active=false

# Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# Smallrye OpenAPI
quarkus.smallrye-openapi.path=/openapi

# Jackson
quarkus.jackson.fail-on-unknown-properties=true