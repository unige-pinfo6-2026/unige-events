_format_version: "3.0"

services:
  # ───── event-service ────────────────────────────────────────────────────────
  - name: event-service
    url: http://devcontainer:8082
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: event-share
        paths: ['~/api/events/(?:\d+)/share$']
        strip_path: false
        preserve_host: true
      - name: shortlink
        paths: ['~/api/s/[^/]+$']
        strip_path: false
        preserve_host: true
      - name: event-view
        paths: ['~/api/events/(?:\d+)/view$']
        strip_path: false
        preserve_host: true
      - name: favorite-actions
        paths: ['~/api/events/(?:\d+)/favorite$']
        strip_path: false
        preserve_host: true
      - name: my-favorites
        paths: ['~/api/users/me/favorites$']
        strip_path: false
        preserve_host: true
      - name: co-organizer-me
        paths: ['~/api/events/(?:\d+)/co-organizers/me/(?:accept|decline)$']
        strip_path: false
        preserve_host: true
      - name: co-organizer-userid
        paths: ['~/api/events/(?:\d+)/co-organizers/[^/]+$']
        strip_path: false
        preserve_host: true
      - name: co-organizers
        paths: ['~/api/events/(?:\d+)/co-organizers$']
        strip_path: false
        preserve_host: true
      - name: my-co-org-invites
        paths: ['~/api/users/me/co-organizer-invitations$']
        strip_path: false
        preserve_host: true
      - name: event-stats
        paths: ['~/api/events/(?:\d+)/stats$']
        strip_path: false
        preserve_host: true
      - name: my-events
        paths: ['~/api/users/me/events$']
        strip_path: false
        preserve_host: true
      - name: events-search
        paths: ['~/api/events/search$']
        strip_path: false
        preserve_host: true
      - name: events-featured
        paths: ['~/api/events/featured$']
        strip_path: false
        preserve_host: true
      - name: admin-event-feature
        paths: ['~/api/admin/events/(?:\d+)/(?:un)?feature$']
        strip_path: false
        preserve_host: true
      - name: events-occurrences
        paths: ['~/api/events/(?:\d+)/occurrences$']
        strip_path: false
        preserve_host: true
      - name: events-cancel
        paths: ['~/api/events/(?:\d+)/cancel$']
        strip_path: false
        preserve_host: true
      - name: events-restore
        paths: ['~/api/events/(?:\d+)/restore$']
        strip_path: false
        preserve_host: true
      - name: events-publish
        paths: ['~/api/events/(?:\d+)/publish$']
        strip_path: false
        preserve_host: true
      - name: events-image
        paths: ['~/api/events/(?:\d+)/image$']
        strip_path: false
        preserve_host: true
      - name: events-attachments
        # SCRUM-148 — POST /api/events/{id}/attachments + DELETE on
        # /attachments/{aid}. SCRUM-149 — optional /download suffix for
        # the public force-download endpoint. Single regex covers all
        # sub-paths. Must be declared BEFORE events-by-id so the
        # /attachments suffix is not swallowed by the catch-all id route.
        # Mirrors helm/templates/kong/configmap-routes.yaml.
        paths: ['~/api/events/(?:\d+)/attachments(?:/(?:\d+)(?:/download)?)?$']
        strip_path: false
        preserve_host: true
      - name: events-organizer-uuids
        # GET /api/events/{id}/organizer-uuids — @PermitAll (ADR-002). Public so
        # the public event page resolves the organizer team (creator + ACCEPTED
        # co-organizers) for anonymous viewers via usePublicOrganizers. Declared
        # BEFORE events-by-id so the /organizer-uuids suffix is not swallowed by
        # the catch-all id route. Mirrors helm + k8s configmap-routes.yaml.
        paths: ['~/api/events/(?:\d+)/organizer-uuids$']
        strip_path: false
        preserve_host: true
      - name: events-by-id
        paths: ['~/api/events/(?:\d+)$']
        strip_path: false
        preserve_host: true
      # /api/events split by method so the rate limit applies to CREATE only.
      # Previously a single all-methods route throttled the public GET listing
      # to 10/min per IP (unusable behind shared NAT) — see load-testing/RESULTS.md.
      - name: events-create
        paths: ['~/api/events$']
        methods: ['POST']
        strip_path: false
        preserve_host: true
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              policy: local
              fault_tolerant: true
              hide_client_headers: false
      - name: events-list
        paths: ['~/api/events$']
        methods: ['GET', 'HEAD', 'OPTIONS']
        strip_path: false
        preserve_host: true

  # ───── user-service ──────────────────────────────────────────────────────────
  - name: user-service
    url: http://devcontainer:8081
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: user-image
        paths: ['~/api/users/me/image$']
        strip_path: false
        preserve_host: true
      - name: user-banner
        paths: ['~/api/users/me/banner$']
        strip_path: false
        preserve_host: true
      - name: update-username
        paths: ['~/api/users/me/username$']
        strip_path: false
        preserve_host: true
      - name: get-by-username
        paths: ['~/api/users/by-username/[^/]+$']
        strip_path: false
        preserve_host: true
      - name: user-by-id
        paths: ['~/api/users/[^/]+$']
        strip_path: false
        preserve_host: true
      - name: follow-actions
        paths: ['~/api/users/[^/]+/follow$']
        strip_path: false
        preserve_host: true
        plugins:
          - name: rate-limiting
            config:
              minute: 30
              policy: local
              fault_tolerant: true
              hide_client_headers: false
      - name: follow-listings
        paths: ['~/api/users/[^/]+/(?:followers|following)$']
        strip_path: false
        preserve_host: true
      - name: remove-follower
        # DELETE /api/users/me/followers/{followerId} — kick a follower off your
        # own followers list (the mirror of unfollow). 4 segments so it doesn't
        # collide with follow-listings (3 segments, anchored $).
        paths: ['~/api/users/me/followers/[^/]+$']
        strip_path: false
        preserve_host: true
      - name: follow-requests
        paths: ['~/api/follow-requests/(?:\d+)/(?:accept|reject)$']
        strip_path: false
        preserve_host: true
      - name: my-follow-reqs
        paths: ['~/api/users/me/follow-requests$']
        strip_path: false
        preserve_host: true
      - name: calendar-token
        paths: ['~/api/users/me/calendar-token$']
        strip_path: false
        preserve_host: true
      - name: calendar-regen
        paths: ['~/api/users/me/calendar-token/regenerate$']
        strip_path: false
        preserve_host: true
      - name: ics-feed
        paths: ['~/api/calendar/[^/]+\.ics$']
        strip_path: false
        preserve_host: true

  # ───── moderation-service ────────────────────────────────────────────────────
  - name: moderation-service
    url: http://devcontainer:8084
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: report-event
        paths: ['~/api/events/(?:\d+)/report$']
        strip_path: false
        preserve_host: true
      - name: report-comment
        # SCRUM-144 — POST /api/comments/{id}/report routes to moderation-service
        # (engagement-service owns /api/comments/{id} + /like). Mirrors the helm
        # configmap-routes.yaml block so local == prod.
        paths: ['~/api/comments/(?:\d+)/report$']
        strip_path: false
        preserve_host: true
      - name: admin-reports
        paths: ['~/api/admin/reports$']
        strip_path: false
        preserve_host: true
      - name: admin-report-id
        paths: ['~/api/admin/reports/(?:\d+)$']
        strip_path: false
        preserve_host: true

  # ───── engagement-service ────────────────────────────────────────────────────
  - name: engagement-service
    url: http://devcontainer:8083
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: attend-actions
        paths: ['~/api/events/(?:\d+)/attend$']
        strip_path: false
        preserve_host: true
      - name: event-attendees
        paths: ['~/api/events/(?:\d+)/attendees$']
        strip_path: false
        preserve_host: true
      - name: my-attendances
        paths: ['~/api/users/me/attendances$']
        strip_path: false
        preserve_host: true
      - name: my-participations
        paths: ['~/api/users/me/participations$']
        strip_path: false
        preserve_host: true
      - name: user-participations
        # SCRUM-141 suite — GET /api/users/{id}/participations (participations
        # publiques). [^/]+ couvre l'UUID cible (et "me", même upstream).
        paths: ['~/api/users/[^/]+/participations$']
        strip_path: false
        preserve_host: true
      - name: event-comments
        paths: ['~/api/events/(?:\d+)/comments$']
        strip_path: false
        preserve_host: true
        plugins:
          - name: rate-limiting
            config:
              minute: 10
              policy: local
              fault_tolerant: true
              hide_client_headers: false
      - name: comment-direct
        paths: ['~/api/comments/(?:\d+)$']
        strip_path: false
        preserve_host: true

  # ───── notification-service ──────────────────────────────────────────────────
  # SCRUM-99 — in-app notifications. Mirrors the helm configmap-routes.yaml block
  # (was missing locally, so /api/users/me/notifications 404'd at the gateway).
  # Routes ordered most-specific-first to avoid prefix shadowing.
  - name: notification-service
    url: http://devcontainer:8085
    connect_timeout: 5000
    read_timeout: 30000
    write_timeout: 30000
    routes:
      - name: notifications-read-all
        paths: ['~/api/users/me/notifications/read-all$']
        strip_path: false
        preserve_host: true
      - name: notification-mark-read
        paths: ['~/api/users/me/notifications/(?:\d+)/read$']
        strip_path: false
        preserve_host: true
      - name: user-notifications
        paths: ['~/api/users/me/notifications/?$']
        strip_path: false
        preserve_host: true

plugins:
  - name: correlation-id
    config:
      header_name: X-Request-ID
      generator: uuid
      echo_downstream: true
  
  # Strip any forged X-Internal-Token coming from outside — same as prod.
  - name: request-transformer
    config:
      remove:
        headers:
          - X-Internal-Token
