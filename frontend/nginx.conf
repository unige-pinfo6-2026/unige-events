server {
    listen 80;

    # Pentest 2026-04-17 finding 4.6 — hide nginx version & vendor name from
    # error responses and the Server header. server_tokens off; suppresses the
    # version suffix on the Server header and removes the "<center>nginx</center>"
    # signature from default error pages.
    server_tokens off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Override nginx's branded default 404 page (which mentions nginx) by
    # serving the SPA shell instead. try_files already covers the SPA-routing
    # case; this is the explicit fallback for any path nginx itself rejects.
    error_page 404 /index.html;
}
