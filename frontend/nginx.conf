server {
    listen 80;

    # Pentest 2026-04-17 finding 4.6 — hide nginx version from the Server
    # header. server_tokens off; strips the "/x.y.z" version suffix (and the
    # version line in the default error footer when this build emits one),
    # but it does NOT unbrand the HTML body of the default error pages —
    # that's what error_page below handles.
    server_tokens off;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Replace nginx's default branded 404 (which contains "<center>nginx</center>"
    # in its body) with the SPA shell. try_files already covers SPA routing
    # for matched locations; this is the explicit fallback for any path
    # nginx itself rejects, and is what actually removes the "nginx" string
    # from response bodies.
    error_page 404 /index.html;
}
