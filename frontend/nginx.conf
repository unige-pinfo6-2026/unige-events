server {
    listen 80;

    # Pentest 2026-04-17 finding 4.6 — hide nginx version from the Server
    # header. server_tokens off; strips the "/x.y.z" version suffix (and the
    # version line in the default error footer when this build emits one),
    # but it does NOT unbrand the HTML body of the default error pages —
    # that's what error_page below handles.
    server_tokens off;

    # Pentest 2026-04-17 findings 4.13/4.19 — reject oversized uploads at the
    # nginx edge before they reach Quarkus. 6m gives headroom above the largest
    # backend limit (5 MB for banners) while still blocking multi-MB abuse.
    client_max_body_size 6m;

    # Pentest 2026-04-17 finding 4.3 — defense-in-depth security headers. HSTS is
    # already injected upstream by the ingress-nginx controller, so it is not
    # repeated here. "always" makes these apply to error responses too (e.g. the
    # error_page 404 -> /index.html fallback below). The lone "location /" block
    # defines no add_header, so these server-level headers are inherited there.
    #
    # CSP ships in Report-Only first (finding 4.3 rollout plan): violations are
    # reported but nothing is blocked, so login/avatars/maps cannot break during
    # the observation window. Flip to enforcing "Content-Security-Policy" in a
    # follow-up once the policy is validated. Rationale for each source list:
    #   script-src 'self'          — Vite emits external hashed bundles, no inline JS
    #   style-src  'unsafe-inline' — React inline styles + animated Blobs set style=
    #   img-src    googleusercontent — Google avatars from Auth0 social login
    #              data:/blob:     — EventForm crop preview
    #   connect-src auth0          — getAccessTokenSilently token/JWKS fetch
    #   frame-src  auth0           — Auth0 silent-auth iframe (localstorage cache)
    #              www.google.com  — Footer Google Maps embed
    #   frame-ancestors 'none'     — anti-clickjacking (who may frame us)
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https://lh3.googleusercontent.com https://*.googleusercontent.com; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://dev-p8ufbvhr6g61j78w.us.auth0.com; frame-src https://dev-p8ufbvhr6g61j78w.us.auth0.com https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=()" always;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Replace nginx's default branded 404 (which contains "<center>nginx</center>"
    # in its body) with the SPA shell. try_files already covers SPA routing
    # for matched locations; this is the explicit fallback for any path
    # nginx itself rejects, and is what actually removes the "nginx" string
    # from response bodies.
    error_page 404 /index.html;
}
