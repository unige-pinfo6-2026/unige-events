quarkus.http.root-path=api
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
%dev.quarkus.http.port=8081

# ─── Datasource ────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.dev-ui.allow-sql=true
%dev,prod.quarkus.datasource.username=${DB_USER:postgres}
%dev,prod.quarkus.datasource.password=${DB_PASSWORD:postgres}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/${DB_NAME:unige_events_users}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:unige_events_users}

# ─── Hibernate ─────────────────────────────────────────────────────────────
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# ─── Flyway ────────────────────────────────────────────────────────────────
# user-service owns V1__create_users + V14__create_follows (Décision A,
# Flyway redistribué par service propriétaire). %test relies on Hibernate
# drop-and-create against a DevServices ephemeral Postgres — Flyway disabled.
quarkus.flyway.enabled=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.out-of-order=true
quarkus.flyway.validate-on-migrate=false
%test.quarkus.flyway.enabled=false

# ─── OIDC ──────────────────────────────────────────────────────────────────
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.client-id=${OIDC_CLIENT_ID}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
quarkus.oidc.token.audience=${OIDC_AUDIENCE}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path="${OIDC_ROLE_NAMESPACE}"
%test.quarkus.oidc.enabled=false

# ─── Jackson ───────────────────────────────────────────────────────────────
quarkus.jackson.fail-on-unknown-properties=true

# ─── Amazon S3 (avatar + banner uploads) ──────────────────────────────────
quarkus.s3.path-style-access=true
quarkus.s3.aws.region=${S3_REGION:eu-central-1}
%dev.quarkus.s3.endpoint-override=http://minio:9000
%prod.quarkus.s3.endpoint-override=${S3_ENDPOINT:http://minio:9000}
%dev,prod.quarkus.s3.aws.credentials.type=static
%dev,prod.quarkus.s3.aws.credentials.static-provider.access-key-id=${S3_ACCESS_KEY:minioadmin}
%dev,prod.quarkus.s3.aws.credentials.static-provider.secret-access-key=${S3_SECRET_KEY:minioadmin}
%test.quarkus.s3.endpoint-override=http://localhost:9000
%test.quarkus.s3.aws.credentials.type=static
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=test
app.s3.url=${S3_URL:http://localhost:9000}
app.s3.bucket=${S3_BUCKET:unige-events-dev}

# ─── Frontend URL (for ICS cal:// links — absorbed from calendar-service in 2.3.2) ──
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ─── OpenAPI ───────────────────────────────────────────────────────────────
quarkus.smallrye-openapi.path=/openapi

# ─── Container image ───────────────────────────────────────────────────────
quarkus.container-image.name=unige-events-user-service

# ─── Observability (Étape 9 of completion spec — SPEC-004 / SPEC-012 / SPEC-019) ───
quarkus.log.console.json=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# ─── Kafka producers users.{followed,follow-requested,follow-accepted} ─────
# (absorbed from follow-service in finalization Étape 2.3.1)
%dev.kafka.bootstrap.servers=kafka:9092
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
%test.kafka.bootstrap.servers=localhost:9092

mp.messaging.outgoing.users-followed.connector=smallrye-kafka
mp.messaging.outgoing.users-followed.topic=users.followed
mp.messaging.outgoing.users-followed.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
%test.mp.messaging.outgoing.users-followed.connector=smallrye-in-memory

mp.messaging.outgoing.users-follow-requested.connector=smallrye-kafka
mp.messaging.outgoing.users-follow-requested.topic=users.follow-requested
mp.messaging.outgoing.users-follow-requested.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
%test.mp.messaging.outgoing.users-follow-requested.connector=smallrye-in-memory

mp.messaging.outgoing.users-follow-accepted.connector=smallrye-kafka
mp.messaging.outgoing.users-follow-accepted.topic=users.follow-accepted
mp.messaging.outgoing.users-follow-accepted.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
%test.mp.messaging.outgoing.users-follow-accepted.connector=smallrye-in-memory

# ─── X-Request-ID Kafka tracing interceptor (Étape 3.1, KAFKA-002 / Décision D) ─
mp.messaging.outgoing.users-followed.interceptor.classes=ch.unige.events.shared.tracing.MdcKafkaProducerInterceptor
mp.messaging.outgoing.users-follow-requested.interceptor.classes=ch.unige.events.shared.tracing.MdcKafkaProducerInterceptor
mp.messaging.outgoing.users-follow-accepted.interceptor.classes=ch.unige.events.shared.tracing.MdcKafkaProducerInterceptor

# ─── REST clients (Étape 2.1 finalization-ultimate, REST-001) ──────────────
# user-service consume event-service (CalendarService bulk fetch + enrich)
# et engagement-service (UserAttendances feed ICS — Décision B).
quarkus.rest-client.event-service.url=${EVENT_SERVICE_URL:http://event-service:8080}
%dev.quarkus.rest-client.event-service.url=http://localhost:8082
quarkus.rest-client.engagement-service.url=${ENGAGEMENT_SERVICE_URL:http://engagement-service:8080}
%dev.quarkus.rest-client.engagement-service.url=http://localhost:8083
quarkus.rest-client.event-service.connect-timeout=2000
quarkus.rest-client.event-service.read-timeout=5000
quarkus.rest-client.engagement-service.connect-timeout=2000
quarkus.rest-client.engagement-service.read-timeout=5000

# Étape 4.2 finalization-ultimate (DUP-002): used by shared ServiceIdentityResource
quarkus.application.name=user-service

# ─── X-Internal-Token (Étape 3.2, SEC-002-bis / Décision C) ────────────────
# Defense in depth on top of the K8s perimeter for service-to-service
# endpoints flagged @Internal. Sourced from Doppler in prod via the
# INTERNAL_TOKEN env var — same value across all services. No prod
# fallback: when INTERNAL_TOKEN is unset (or empty) the InternalTokenFilter
# rejects every request to @Internal endpoints with 404 (fail-closed). This
# keeps the secret out of the repo and surfaces missing config as a startup
# symptom, not a silent security regression.
unige.internal-token=${INTERNAL_TOKEN:}
%test.unige.internal-token=test-internal-token
