quarkus.http.root-path=api
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
%dev.quarkus.http.port=8085

# ─── Application ───────────────────────────────────────────────────────────
quarkus.application.name=notification-service

# ─── OpenAPI ───────────────────────────────────────────────────────────────
quarkus.smallrye-openapi.path=/openapi

# ─── Observability ─────────────────────────────────────────────────────────
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# ─── Datasource (postgres-notification, DB unige_events_notifications) ────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.dev-ui.allow-sql=true
%dev,prod.quarkus.datasource.username=${DB_USER:postgres}
%dev,prod.quarkus.datasource.password=${DB_PASSWORD:postgres}
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://postgres:5432/${DB_NAME:unige_events_notifications}
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:postgres-notification}:${DB_PORT:5432}/${DB_NAME:unige_events_notifications}

# ─── Hibernate ─────────────────────────────────────────────────────────────
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# ─── Flyway ────────────────────────────────────────────────────────────────
quarkus.flyway.enabled=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.out-of-order=true
quarkus.flyway.validate-on-migrate=false
%test.quarkus.flyway.enabled=false

# ─── OIDC ──────────────────────────────────────────────────────────────────
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.client-id=${OIDC_CLIENT_ID}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
quarkus.oidc.token.audience=${OIDC_AUDIENCE}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path="${OIDC_ROLE_NAMESPACE}"
%test.quarkus.oidc.enabled=false

# ─── Jackson ───────────────────────────────────────────────────────────────
quarkus.jackson.fail-on-unknown-properties=true

# ─── Kafka consumers (events.{cancelled,updated} + attendances.created) ───
%dev.kafka.bootstrap.servers=kafka:9092
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
%test.kafka.bootstrap.servers=localhost:9092

# events-cancelled — fan out EVENT_CANCELLED notifications to attendees.
# Uses concrete deserializer (Quarkus pattern; ObjectMapperDeserializer has
# no no-arg ctor and Kafka instantiates via reflection).
mp.messaging.incoming.events-cancelled.connector=smallrye-kafka
mp.messaging.incoming.events-cancelled.topic=events.cancelled
mp.messaging.incoming.events-cancelled.value.deserializer=ch.unige.events.notification.kafka.EventLifecycleEventDeserializer
mp.messaging.incoming.events-cancelled.group.id=notification-service
mp.messaging.incoming.events-cancelled.failure-strategy=ignore
%test.mp.messaging.incoming.events-cancelled.connector=smallrye-in-memory

# events-updated (NEW SCRUM-99) — fan out EVENT_UPDATED to attendees.
mp.messaging.incoming.events-updated.connector=smallrye-kafka
mp.messaging.incoming.events-updated.topic=events.updated
mp.messaging.incoming.events-updated.value.deserializer=ch.unige.events.notification.kafka.EventLifecycleEventDeserializer
mp.messaging.incoming.events-updated.group.id=notification-service
mp.messaging.incoming.events-updated.failure-strategy=ignore
%test.mp.messaging.incoming.events-updated.connector=smallrye-in-memory

# attendances-created (NEW SCRUM-99) — notify creator of new ATTENDING signup.
mp.messaging.incoming.attendances-created.connector=smallrye-kafka
mp.messaging.incoming.attendances-created.topic=attendances.created
mp.messaging.incoming.attendances-created.value.deserializer=ch.unige.events.notification.kafka.AttendanceCreatedEventDeserializer
mp.messaging.incoming.attendances-created.group.id=notification-service
mp.messaging.incoming.attendances-created.failure-strategy=ignore
%test.mp.messaging.incoming.attendances-created.connector=smallrye-in-memory

# users-followed (NEW SCRUM-140) — fan out NEW_FOLLOWER to the followed user.
# Pattern miroir des channels phase 1 — connector=smallrye-kafka, value.deserializer
# pointe sur la subclass concrète FollowLifecycleEventDeserializer (piège #7).
# Group id partagé avec les autres channels notification-service.
mp.messaging.incoming.users-followed.connector=smallrye-kafka
mp.messaging.incoming.users-followed.topic=users.followed
mp.messaging.incoming.users-followed.value.deserializer=ch.unige.events.notification.kafka.FollowLifecycleEventDeserializer
mp.messaging.incoming.users-followed.group.id=notification-service
mp.messaging.incoming.users-followed.failure-strategy=ignore
%test.mp.messaging.incoming.users-followed.connector=smallrye-in-memory

# users-follow-requested (NEW SCRUM-140) — fan out FOLLOW_REQUEST (private-profile PENDING).
mp.messaging.incoming.users-follow-requested.connector=smallrye-kafka
mp.messaging.incoming.users-follow-requested.topic=users.follow-requested
mp.messaging.incoming.users-follow-requested.value.deserializer=ch.unige.events.notification.kafka.FollowLifecycleEventDeserializer
mp.messaging.incoming.users-follow-requested.group.id=notification-service
mp.messaging.incoming.users-follow-requested.failure-strategy=ignore
%test.mp.messaging.incoming.users-follow-requested.connector=smallrye-in-memory

# users-follow-accepted (NEW SCRUM-140) — fan out FOLLOW_ACCEPTED to the original requester.
# Décision C critique : destinataire = followerId (initiateur), pas followedId (acceptant).
mp.messaging.incoming.users-follow-accepted.connector=smallrye-kafka
mp.messaging.incoming.users-follow-accepted.topic=users.follow-accepted
mp.messaging.incoming.users-follow-accepted.value.deserializer=ch.unige.events.notification.kafka.FollowLifecycleEventDeserializer
mp.messaging.incoming.users-follow-accepted.group.id=notification-service
mp.messaging.incoming.users-follow-accepted.failure-strategy=ignore
%test.mp.messaging.incoming.users-follow-accepted.connector=smallrye-in-memory

# ─── REST clients (event-service, engagement-service, user-service) ───────
# notification-service consumes downstream services to compose notification
# messages (fetch event title/creatorId) and resolve auth0Id → userId via
# the internal endpoint on user-service.
quarkus.rest-client.event-service.url=${EVENT_SERVICE_URL:http://event-service:8080/api}
%dev.quarkus.rest-client.event-service.url=http://localhost:8082/api
quarkus.rest-client.engagement-service.url=${ENGAGEMENT_SERVICE_URL:http://engagement-service:8080/api}
%dev.quarkus.rest-client.engagement-service.url=http://localhost:8083/api
quarkus.rest-client.user-service.url=${USER_SERVICE_URL:http://user-service:8080/api}
%dev.quarkus.rest-client.user-service.url=http://localhost:8081/api
quarkus.rest-client.event-service.connect-timeout=2000
quarkus.rest-client.event-service.read-timeout=5000
quarkus.rest-client.engagement-service.connect-timeout=2000
quarkus.rest-client.engagement-service.read-timeout=5000
quarkus.rest-client.user-service.connect-timeout=2000
quarkus.rest-client.user-service.read-timeout=5000

# ─── X-Internal-Token ──────────────────────────────────────────────────────
unige.internal-token=${INTERNAL_TOKEN:dev-internal-secret}
%test.unige.internal-token=test-internal-token
