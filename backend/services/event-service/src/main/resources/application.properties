quarkus.http.root-path=api
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# ─── Datasource ────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.dev-ui.allow-sql=true
%dev,prod.quarkus.datasource.username=${DB_USER:postgres}
%dev,prod.quarkus.datasource.password=${DB_PASSWORD:postgres}
%dev,prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:unige_events}

# ─── Hibernate ─────────────────────────────────────────────────────────────
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# ─── Flyway ────────────────────────────────────────────────────────────────
# event-service owns V2/V4/V5/V7/V8/V9/V11/V12/V13/V17 (Décision A).
# %test uses Hibernate drop-and-create on DevServices Postgres — Flyway disabled.
quarkus.flyway.enabled=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.locations=classpath:db/migration
quarkus.flyway.out-of-order=true
quarkus.flyway.validate-on-migrate=false
%test.quarkus.flyway.enabled=false

# ─── OIDC ──────────────────────────────────────────────────────────────────
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL}
quarkus.oidc.client-id=${OIDC_CLIENT_ID}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET}
quarkus.oidc.token.audience=${OIDC_AUDIENCE}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path="${OIDC_ROLE_NAMESPACE}"
%test.quarkus.oidc.enabled=false

# ─── Jackson ───────────────────────────────────────────────────────────────
quarkus.jackson.fail-on-unknown-properties=true

# ─── Scheduler ─────────────────────────────────────────────────────────────
# Disable @Scheduled in tests so the sentinel test doesn't have to carry
# the full events / users / attendances tables for the EventExpirationJob.
%test.quarkus.scheduler.enabled=false

# ─── Amazon S3 (event banner upload) ──────────────────────────────────────
quarkus.s3.path-style-access=true
quarkus.s3.aws.region=${S3_REGION:eu-central-1}
%dev,prod.quarkus.s3.endpoint-override=${S3_ENDPOINT:http://minio:9000}
%dev,prod.quarkus.s3.aws.credentials.type=static
%dev,prod.quarkus.s3.aws.credentials.static-provider.access-key-id=${S3_ACCESS_KEY:minioadmin}
%dev,prod.quarkus.s3.aws.credentials.static-provider.secret-access-key=${S3_SECRET_KEY:minioadmin}
%test.quarkus.s3.endpoint-override=http://localhost:9000
%test.quarkus.s3.aws.credentials.type=static
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=test
app.s3.url=${S3_URL:http://localhost:9000}
app.s3.bucket=${S3_BUCKET:unige-events-dev}

# ─── Frontend URL (for share URLs — absorbed from share-service in 2.2.1) ──
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ─── Kafka (lifecycle events: published, cancelled, expired) ──────────────
# Producer-only for now — consumers (notification-service) are out of scope
# in S8 (cf. SCRUM-99 follow-up). Each channel maps to one of the topics
# provisioned by the kafka-topics-init Job in the helm chart. The %test
# profile flips every connector to smallrye-in-memory so sentinel tests
# don't need a real broker.
%dev,prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
%test.kafka.bootstrap.servers=localhost:9092

mp.messaging.outgoing.events-published.connector=smallrye-kafka
mp.messaging.outgoing.events-published.topic=events.published
mp.messaging.outgoing.events-published.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
%test.mp.messaging.outgoing.events-published.connector=smallrye-in-memory

mp.messaging.outgoing.events-cancelled.connector=smallrye-kafka
mp.messaging.outgoing.events-cancelled.topic=events.cancelled
mp.messaging.outgoing.events-cancelled.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
%test.mp.messaging.outgoing.events-cancelled.connector=smallrye-in-memory

mp.messaging.outgoing.events-expired.connector=smallrye-kafka
mp.messaging.outgoing.events-expired.topic=events.expired
mp.messaging.outgoing.events-expired.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
%test.mp.messaging.outgoing.events-expired.connector=smallrye-in-memory

# ─── Kafka producers co-organizers.{invited,accepted} (absorbed from co-organizer-service in 2.2.4) ─
mp.messaging.outgoing.co-organizers-invited.connector=smallrye-kafka
mp.messaging.outgoing.co-organizers-invited.topic=co-organizers.invited
mp.messaging.outgoing.co-organizers-invited.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
%test.mp.messaging.outgoing.co-organizers-invited.connector=smallrye-in-memory

mp.messaging.outgoing.co-organizers-accepted.connector=smallrye-kafka
mp.messaging.outgoing.co-organizers-accepted.topic=co-organizers.accepted
mp.messaging.outgoing.co-organizers-accepted.value.serializer=io.quarkus.kafka.client.serialization.ObjectMapperSerializer
%test.mp.messaging.outgoing.co-organizers-accepted.connector=smallrye-in-memory

# ─── Kafka consumer events.banned (Étape 4.4 — KAFKA-002) ────────────────
mp.messaging.incoming.events-banned.connector=smallrye-kafka
mp.messaging.incoming.events-banned.topic=events.banned
mp.messaging.incoming.events-banned.value.deserializer=io.quarkus.kafka.client.serialization.ObjectMapperDeserializer
mp.messaging.incoming.events-banned.value.deserializer.type=ch.unige.events.shared.kafka.events.EventBannedEvent
mp.messaging.incoming.events-banned.group.id=event-service
%test.mp.messaging.incoming.events-banned.connector=smallrye-in-memory

# ─── OpenAPI ───────────────────────────────────────────────────────────────
quarkus.smallrye-openapi.path=/openapi

# ─── Container image ───────────────────────────────────────────────────────
quarkus.container-image.name=unige-events-event-service

# ─── Observability (Étape 9 of completion spec — SPEC-004 / SPEC-012 / SPEC-019) ───
quarkus.log.console.json=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/q/metrics

# ─── REST clients (Étape 2.1 finalization-ultimate, REST-001) ──────────────
# event-service consume user-service (UserServiceClient.getById(uuid)) et
# engagement-service (EngagementServiceClient.getAttendanceSummary{,Bulk}).
# Helm/K8s: defaults `http://<svc>-service:8080` via DNS K8s par-namespace.
quarkus.rest-client.user-service.url=${USER_SERVICE_URL:http://user-service:8080}
quarkus.rest-client.engagement-service.url=${ENGAGEMENT_SERVICE_URL:http://engagement-service:8080}
quarkus.rest-client.user-service.connect-timeout=2000
quarkus.rest-client.engagement-service.connect-timeout=2000

# Étape 4.2 finalization-ultimate (DUP-002): used by shared ServiceIdentityResource
quarkus.application.name=event-service
