quarkus.http.root-path=api
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# ─── Datasource ────────────────────────────────────────────────────────────
quarkus.datasource.db-kind=postgresql
quarkus.datasource.dev-ui.allow-sql=true
%dev,prod.quarkus.datasource.username=${DB_USER:postgres}
%dev,prod.quarkus.datasource.password=${DB_PASSWORD:postgres}
%dev,prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:unige_events}

# ─── Hibernate ─────────────────────────────────────────────────────────────
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# ─── Flyway ────────────────────────────────────────────────────────────────

# ─── OIDC ──────────────────────────────────────────────────────────────────
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:https://your-auth-server.com/}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:your-client-id}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:your-client-secret}
quarkus.oidc.token.audience=${OIDC_AUDIENCE:https://your-api-audience}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path="${OIDC_ROLE_NAMESPACE:https://unige-events/roles}"
%test.quarkus.oidc.enabled=false

# ─── Jackson ───────────────────────────────────────────────────────────────
quarkus.jackson.fail-on-unknown-properties=true

# ─── Scheduler ─────────────────────────────────────────────────────────────
# Disable @Scheduled in tests so the sentinel test doesn't have to carry
# the full events / users / attendances tables for the EventExpirationJob.
%test.quarkus.scheduler.enabled=false

# ─── Amazon S3 (event banner upload) ──────────────────────────────────────
quarkus.s3.path-style-access=true
quarkus.s3.aws.region=${S3_REGION:eu-central-1}
%dev,prod.quarkus.s3.endpoint-override=${S3_ENDPOINT:http://minio:9000}
%dev,prod.quarkus.s3.aws.credentials.type=static
%dev,prod.quarkus.s3.aws.credentials.static-provider.access-key-id=${S3_ACCESS_KEY:minioadmin}
%dev,prod.quarkus.s3.aws.credentials.static-provider.secret-access-key=${S3_SECRET_KEY:minioadmin}
%test.quarkus.s3.endpoint-override=http://localhost:9000
%test.quarkus.s3.aws.credentials.type=static
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=test
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=test
app.s3.url=${S3_URL:http://localhost:9000}
app.s3.bucket=${S3_BUCKET:unige-events-dev}

# ─── Kafka (lifecycle events: published, cancelled, expired) ──────────────
# Producer-only for now — consumers (notification-service) are out of scope
# in S8 (cf. SCRUM-99 follow-up). Each channel maps to one of the topics
# provisioned by the kafka-topics-init Job in the helm chart. The %test
# profile flips every connector to smallrye-in-memory so sentinel tests
# don't need a real broker.
%dev,prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
%test.kafka.bootstrap.servers=localhost:9092

mp.messaging.outgoing.events-published.connector=smallrye-kafka
mp.messaging.outgoing.events-published.topic=events.published
%test.mp.messaging.outgoing.events-published.connector=smallrye-in-memory

mp.messaging.outgoing.events-cancelled.connector=smallrye-kafka
mp.messaging.outgoing.events-cancelled.topic=events.cancelled
%test.mp.messaging.outgoing.events-cancelled.connector=smallrye-in-memory

mp.messaging.outgoing.events-expired.connector=smallrye-kafka
mp.messaging.outgoing.events-expired.topic=events.expired
%test.mp.messaging.outgoing.events-expired.connector=smallrye-in-memory

# ─── OpenAPI ───────────────────────────────────────────────────────────────
quarkus.smallrye-openapi.path=/openapi

# ─── Container image ───────────────────────────────────────────────────────
quarkus.container-image.name=unige-events-event-service
