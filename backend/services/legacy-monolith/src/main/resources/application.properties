quarkus.http.root-path=api
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
%dev,prod.quarkus.http.limits.max-body-size=6M

# Datasource
quarkus.datasource.db-kind=postgresql
quarkus.datasource.dev-ui.allow-sql=true
%dev,prod.quarkus.datasource.username=${DB_USER:postgres}
%dev,prod.quarkus.datasource.password=${DB_PASSWORD:postgres}
%dev,prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:unige_events}

# Hibernate — Flyway owns schema in dev/prod; Hibernate validates that entities match the migrated schema.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Flyway — migrations live in src/main/resources/db/migration/.
# baseline-on-migrate=true lets existing (Hibernate-update-managed) databases adopt Flyway from V1 forward
# without needing a retroactive baseline dump.
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
quarkus.flyway.locations=classpath:db/migration

# OIDC
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:https://your-auth-server.com/}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:your-client-id}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:your-client-secret}
quarkus.oidc.token.audience=${OIDC_AUDIENCE:https://your-api-audience}
quarkus.oidc.application-type=service

# Quarkus exige que les claim paths contenant `.` ou `/` soient entourés de
# guillemets, sinon il les interprète comme du JsonPointer (split sur `.`) et
# ne match rien — ce qui faisait passer toutes les requêtes admin en 403 dès
# qu'on settait OIDC_ROLE_NAMESPACE à l'URL nue côté Doppler. Les guillemets
# sont maintenant fixés par la property elle-même, donc l'env var peut être
# une simple URL sans guillemets — convention plus intuitive côté ops.
# Cf. https://quarkus.io/guides/security-oidc-bearer-token-authentication#token-claims-and-securityidentity-roles
quarkus.oidc.roles.role-claim-path="${OIDC_ROLE_NAMESPACE:https://unige-events/roles}"

# Swagger UI
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# Smallrye OpenAPI
quarkus.smallrye-openapi.path=/openapi

# Container image name — pinned per-module so the parent reactor can
# build all extracted services with their own GHCR image tags without
# collision. Was previously overridden via CLI in build.yml but with
# multi-module that override was a footgun (every module would push to
# the same image name).
quarkus.container-image.name=unige-events-api

# Jackson
quarkus.jackson.fail-on-unknown-properties=true

# Frontend
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Amazon S3
quarkus.s3.path-style-access=true
quarkus.s3.aws.region=${S3_REGION:eu-central-1}
%dev,prod.quarkus.s3.endpoint-override=${S3_ENDPOINT:http://minio:9000}
%dev,prod.quarkus.s3.aws.credentials.type=static
%dev,prod.quarkus.s3.aws.credentials.static-provider.access-key-id=${S3_ACCESS_KEY:minioadmin}
%dev,prod.quarkus.s3.aws.credentials.static-provider.secret-access-key=${S3_SECRET_KEY:minioadmin}
app.s3.url=${S3_URL:http://localhost:9000}
app.s3.bucket=${S3_BUCKET:unige-events-dev}

# Moderation
app.moderation.auto-hide-threshold=${MODERATION_AUTO_HIDE_THRESHOLD:3}

# Logging — include the X-Request-ID correlation token from MDC on every
# console line. Populated by RequestIdFilter (pentest 2026-04-17 finding 4.7).
quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) [req=%X{requestId}] %s%e%n