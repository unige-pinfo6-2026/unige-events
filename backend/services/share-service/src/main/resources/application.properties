quarkus.http.root-path=api
quarkus.http.host=0.0.0.0
quarkus.http.port=8080

# ─── Datasource ────────────────────────────────────────────────────────────
# Shared PostgreSQL instance (cf. spec decision 8). All extracted services
# point at the same `unige_events` database in S8 ; the schema-per-service
# split happens at step 14 (event-service extraction) when the events table
# moves out of the public schema.
quarkus.datasource.db-kind=postgresql
quarkus.datasource.dev-ui.allow-sql=true
%dev,prod.quarkus.datasource.username=${DB_USER:postgres}
%dev,prod.quarkus.datasource.password=${DB_PASSWORD:postgres}
%dev,prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${DB_NAME:unige_events}

# ─── Hibernate ─────────────────────────────────────────────────────────────
# validate in dev/prod : the events table is owned by legacy-monolith
# (until step 14) so its Flyway migrations have already created the
# columns we declare here ; we only want Hibernate to confirm shape.
# %test : drop-and-create lets DevServices spin up an empty DB and
# Hibernate creates the minimal Event stub for our integration tests.
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
%test.quarkus.hibernate-orm.schema-management.strategy=drop-and-create

# ─── Flyway ────────────────────────────────────────────────────────────────
# Disabled : share-service owns no schema. Flyway lives with the schema
# owners (legacy-monolith today, event-service after step 14).
quarkus.flyway.enabled=false

# ─── OIDC ──────────────────────────────────────────────────────────────────
# Same Auth0 tenant as the legacy monolith (cf. spec decision 7). Each
# microservice validates the JWT locally ; Kong forwards it unchanged.
quarkus.oidc.auth-server-url=${OIDC_AUTH_SERVER_URL:https://your-auth-server.com/}
quarkus.oidc.client-id=${OIDC_CLIENT_ID:your-client-id}
quarkus.oidc.credentials.secret=${OIDC_CLIENT_SECRET:your-client-secret}
quarkus.oidc.token.audience=${OIDC_AUDIENCE:https://your-api-audience}
quarkus.oidc.application-type=service
quarkus.oidc.roles.role-claim-path="${OIDC_ROLE_NAMESPACE:https://unige-events/roles}"
%test.quarkus.oidc.enabled=false

# ─── Jackson ───────────────────────────────────────────────────────────────
quarkus.jackson.fail-on-unknown-properties=true

# ─── Frontend URL (for share URLs) ─────────────────────────────────────────
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ─── Health & OpenAPI ──────────────────────────────────────────────────────
quarkus.smallrye-health.root-path=/q/health
quarkus.smallrye-openapi.path=/openapi

# ─── Container image ───────────────────────────────────────────────────────
# Pinned per-module so the parent reactor can build images for each
# extracted service without name collision (cf. legacy-monolith app.properties
# for the same convention).
quarkus.container-image.name=unige-events-share-service
